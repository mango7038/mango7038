name: Build PostFlow Studio stable release APK
on:
  workflow_dispatch:
  push:
    branches: [postflow-v3-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate and install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore permanent release signing credentials
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.POSTFLOW_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.POSTFLOW_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.POSTFLOW_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.POSTFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$SIGNING_KEYSTORE_BASE64" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Missing one or more PostFlow permanent release signing secrets."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/postflow-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          echo "POSTFLOW_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "POSTFLOW_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Smoke-test WebView startup JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const start=html.indexOf('<script>'),end=html.lastIndexOf('</script>');
          assert(start>=0&&end>start,'Inline application JavaScript missing');
          const script=html.slice(start+8,end);
          assert(script,'Inline application JavaScript missing');
          const element=()=>({innerHTML:'',classList:{add(){},remove(){}},style:{},setAttribute(){},addEventListener(){},querySelectorAll(){return []},scrollTo(){},value:'',textContent:''});
          const document={documentElement:element(),body:element(),getElementById:element,querySelector:element,querySelectorAll(){return []}};
          const window={matchMedia(){return {matches:false,addEventListener(){}}},scrollTo(){}};
          const localStorage={getItem(){return null},setItem(){}};
          const context={document,window,localStorage,setTimeout(){},setInterval(){},console,Intl,Date,JSON,Math,Set,Map};
          vm.createContext(context);
          vm.runInContext(script,context,{timeout:5000});
          assert(document.getElementById('page'),'Page element not found');
          console.log('PostFlow WebView startup smoke test PASS');
          NODE
      - name: Build permanently signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          ls -lh "$APK"
      - name: Check APK manifest and installable package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$AAPT" dump badging "$APK" | head -n 15
          "$AAPT" dump badging "$APK" | grep -q "name='com.postflow.studio.stable'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='2'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostFlow-Studio-7.4.1-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error