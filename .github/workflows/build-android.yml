name: Build PostFlow Studio stable release APK
on:
  workflow_dispatch:
  push:
    branches: [postflow-v3-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate and install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore permanent release signing credentials
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.POSTFLOW_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.POSTFLOW_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.POSTFLOW_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.POSTFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$SIGNING_KEYSTORE_BASE64" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Missing one or more PostFlow permanent release signing secrets."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/postflow-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          echo "POSTFLOW_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "POSTFLOW_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate application JavaScript and critical UI hooks
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const start=html.indexOf('<script>'),end=html.lastIndexOf('</script>');
          assert(start>=0&&end>start,'Inline app JavaScript missing');
          const script=html.slice(start+8,end);
          new vm.Script(script,{filename:'postflow-app.js'});
          for(const hook of ['function render()', 'function postItem(p)', 'function pfLibraryControls()', 'function pfLibraryItems()', 'function exportBackup()', 'function openHealthMonitor()']){
            assert(script.includes(hook),'Required feature missing: '+hook);
          }
          for(const glass of ['GlassSurface','GlassButton','GlassCard','GlassBottomBar','GlassDialog','backdrop-filter:blur','prefers-reduced-motion','prefers-reduced-transparency','pf-sheet-rise','pf-scrolled']){
            assert(html.includes(glass),'Liquid Glass regression: '+glass);
          }
          assert(html.includes("window.addEventListener('scroll'"),'Scroll-responsive chrome missing');
          assert(html.includes('nav#nav'), 'Floating navigation rules missing');
          const nativeBar=fs.readFileSync('app/src/main/java/com/postflow/studio/NativeGlassBar.java','utf8');
          const activity=fs.readFileSync('app/src/main/java/com/postflow/studio/MainActivity.java','utf8');
          assert(nativeBar.includes('paint.setColor(0xff171d34)'),'Opaque navigation foundation missing');
          assert(nativeBar.includes('canvas.drawRoundRect(0,0,getWidth(),getHeight(),r,r,paint)'),'Navigation background fill missing');
          assert(activity.includes('glassScrim')&&activity.includes('setVisibility(visibility)'),'Native bottom scrim/visibility regression');
          assert(html.includes('body.native-glass nav#nav{display:none!important}'),'Duplicate WebView navigation not hidden');
          assert(html.includes('padding-bottom:calc(190px'),'Native navigation scroll clearance missing');
          assert(html.includes('No linked server job · overdue'), 'Overdue unlinked jobs must not appear published');
          assert(html.includes('Local calendar only'), 'Local reminders must be distinguished from server scheduling');
          assert(html.includes('Check server jobs'), 'Publishing troubleshooting action missing');
          console.log('JavaScript syntax, core features, glass navigation and local-vs-server status checks passed');
          NODE
      - name: Four-phase integration guardrails
        run: node tests/fourphase-guardrails.test.js
      - name: Validate Instagram Story no-crop pipeline
        run: node tests/story-no-crop.test.js
      - name: Verify large ZIP and home widget regressions
        run: node tests/widget-large-zip-regression.test.js
      - name: Run large ZIP preview runtime fixture
        run: node tests/large-zip-preview-runtime.test.js
      - name: Build permanently signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          ls -lh "$APK"
      - name: Check APK manifest and installable package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/postflow-badging.txt"
          head -n 15 "$RUNNER_TEMP/postflow-badging.txt"
          grep -q "name='com.postflow.studio.permanent'" "$RUNNER_TEMP/postflow-badging.txt"
          grep -q "versionCode='19'" "$RUNNER_TEMP/postflow-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostFlow-Studio-8.2.3-calendar-colour-update
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error