name: Build PostFlow v5.3 Android APK
on:
  workflow_dispatch:
  push:
    branches: [postflow-v3-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate and install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Require original installed-app signing key
        env:
          KEYSTORE_B64: ${{ secrets.POSTFLOW_LEGACY_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.POSTFLOW_LEGACY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POSTFLOW_LEGACY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.POSTFLOW_LEGACY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::error::Original installed APK signing key not configured. Refusing to produce another conflicting APK. Configure POSTFLOW_LEGACY_KEYSTORE_BASE64 and password/alias secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/postflow-legacy.jks"
          echo "POSTFLOW_KEYSTORE_PATH=$RUNNER_TEMP/postflow-legacy.jks" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "POSTFLOW_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Compile legacy-key-signed Android update
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostFlow-Studio-v5.3-debug-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error