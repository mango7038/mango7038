name: Build PostFlow Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # GitHub's Ubuntu Android runner already includes command-line tools.
      # Avoid setup-android@v3 installing the obsolete SDK package "tools".
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Decode launcher icons
        run: bash postflow-studio/prepare-assets.sh
      - name: Compile Android app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: postflow-studio
      - name: Validate APK
        run: |
          test -s postflow-studio/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose postflow-studio/app/build/outputs/apk/debug/app-debug.apk
          ls -lh postflow-studio/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostFlow-Studio-v3-debug-apk
          path: postflow-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error