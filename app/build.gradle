plugins { id 'com.android.application' }

android {
    namespace 'com.postflow.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.postflow.studio'
        minSdk 26
        targetSdk 35
        versionCode 53
        versionName '5.3.0'
    }
    signingConfigs {
        legacyUpdate {
            storeFile file(System.getenv('POSTFLOW_KEYSTORE_PATH') ?: 'missing-legacy-key.jks')
            storePassword System.getenv('POSTFLOW_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('POSTFLOW_KEY_ALIAS') ?: ''
            keyPassword System.getenv('POSTFLOW_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.legacyUpdate
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}