plugins { id 'com.android.application' }

android {
    namespace 'com.postflow.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.postflow.studio.permanent'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '7.5.0'
    }
    signingConfigs {
        stable {
            storeFile file(System.getenv('POSTFLOW_KEYSTORE_PATH') ?: 'postflow-upload.jks')
            storePassword System.getenv('POSTFLOW_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('POSTFLOW_KEY_ALIAS') ?: ''
            keyPassword System.getenv('POSTFLOW_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}