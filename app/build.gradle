plugins { id 'com.android.application' }

android {
    namespace 'com.postflow.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.postflow.studio.v6'
        minSdk 26
        targetSdk 35
        versionCode 72
        versionName '7.2.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}