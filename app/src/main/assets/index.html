<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101226"><title>PostFlow Studio</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151b31;--line:#29304a;--text:#f5f7ff;--muted:#97a2c3;--primary:#987bff;--green:#2cd5ad;--red:#ff788e;--border:#303957}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0% -20%,#2a2455 0%,transparent 58%),var(--bg);font-family:Inter,Roboto,'Segoe UI',Arial,sans-serif;color:var(--text);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:6;background:#0d1122e9;backdrop-filter:blur(20px);padding:18px 17px 14px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}header h1{font-size:17px;letter-spacing:-.6px;margin:0}header small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin-top:3px}.brand{display:flex;align-items:center;gap:10px}.logo{height:37px;width:37px;border-radius:12px;background:linear-gradient(145deg,#b47aff,#6653da);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 15px #9f7eff66}.circle{width:35px;height:35px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--green)}main{padding:19px 16px 114px;max-width:850px;margin:auto}h2{font-size:23px;letter-spacing:-.8px;margin:0 0 6px}p.sub{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 20px}.chip{display:inline-flex;gap:5px;align-items:center;padding:5px 10px;border-radius:25px;background:#30294f;color:#c8b9ff;font-size:11px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.stat,.card{background:linear-gradient(160deg,#1b2139,#14192c);border:1px solid #353b576b;border-radius:17px;padding:16px}.stat small{color:var(--muted);font-size:12px}.stat b{display:block;font-size:30px;margin:9px 0 3px;letter-spacing:-1px}.stat i{float:right;font-style:normal;color:var(--primary);font-size:20px}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}.section h3{margin:0;font-size:15px}.section a,.link{color:#b9a6ff;font-size:12px;cursor:pointer}.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff12}.item:last-child{border-bottom:0}.thumb{width:50px;height:50px;min-width:50px;border-radius:12px;background:#283252;display:grid;place-items:center;font-size:23px;object-fit:cover}.item .body{flex:1;min-width:0}.item .body b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.item .body small{color:var(--muted);font-size:11px;display:block;margin-top:6px}.tag{padding:5px 9px;font-size:10px;border-radius:20px;background:#342e53;color:#cebdff;white-space:nowrap}.tag.green{background:#103d37;color:#55e1bb}.tag.red{background:#572331;color:#ffa0b1}.btn{border:none;padding:12px 17px;border-radius:11px;background:#8670f9;color:white;font-weight:700}.btn.secondary{background:#26304a;color:#dce1f5;border:1px solid var(--border)}.btn.mini{padding:8px 10px;font-size:11px}.btn.full{width:100%}.btn:disabled{opacity:.5}.actions{display:flex;gap:9px;flex-wrap:wrap}.field{margin:15px 0}.field>label{font-size:12px;color:#b7bfd9;margin-bottom:8px;display:block}input,textarea,select{width:100%;outline:none;color:var(--text);background:#1c2237;border:1px solid #3a4563;padding:12px;border-radius:10px}input[type=date],input[type=time]{color-scheme:dark}input[type=checkbox]{height:18px;width:18px;accent-color:#967cff}textarea{resize:vertical;min-height:76px}.check{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #ffffff10}.check label{flex:1}.muted{color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#12182aee;backdrop-filter:blur(16px);border-top:1px solid #303752;display:flex;justify-content:space-around;padding:9px 1px max(12px,env(safe-area-inset-bottom))}.navItem{display:grid;justify-items:center;color:#a2abc5;font-size:10px;gap:5px;background:none;border:0;width:20%;padding:3px 0}.navItem .ico{font-size:22px}.navItem.active{color:#bba9ff}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:15;background:#03060cc9;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#151b30;border-radius:24px 24px 0 0;max-width:720px;width:100%;max-height:94vh;overflow-y:auto;padding:20px 17px max(25px,env(safe-area-inset-bottom));border:1px solid #3a4364}.sheet h3{font-size:18px;margin:0}.sheet-head{display:flex;justify-content:space-between;align-items:center}.x{background:none;border:0;color:#c1c8dc;font-size:25px;padding:5px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:51px;background:#1d2339;border:1px solid #323954;padding:5px 1px;border-radius:9px;text-align:center;color:#eee;font-size:12px}.day.disabled{opacity:.25}.day strong{font-weight:500}.day small{display:block;margin-top:6px;color:var(--green);font-size:10px}.day.today{border-color:#a993ff}.day.selected{background:#514587}.week{font-size:10px;color:var(--muted);text-align:center;padding:7px 0}.monthnav{display:flex;align-items:center;justify-content:space-between;margin:13px 0}.monthnav button{border:0;background:#252b44;color:#eee;padding:8px 11px;border-radius:9px}.empty{color:var(--muted);text-align:center;padding:30px 8px;line-height:1.7}.note{padding:13px;border-radius:13px;background:#242c47;border:1px solid #4c5879;color:#bdc8eb;line-height:1.55;font-size:12px}.pill{display:inline-block;background:#242d48;color:#d5d9ff;border-radius:7px;font-size:11px;padding:5px 7px;margin:3px}.layout-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bigicon{font-size:38px;text-align:center;padding-top:15px}.banner{background:linear-gradient(120deg,#7158cc,#393e80);border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.banner b{font-size:16px}.banner small{display:block;color:#e0d7ff;margin-top:7px;line-height:1.5}.banner .btn{background:white;color:#40349a}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#303d5b;color:white;padding:10px 15px;border-radius:12px;z-index:22;box-shadow:0 6px 30px #0008;min-width:70%;text-align:center}.fileinput{padding:19px 10px;border:1px dashed #7971c8;text-align:center;background:#201e3b;cursor:pointer}.fileinput input{background:none;border:none;padding:9px 0;color:#cfc3ff;font-size:12px}.line{height:1px;background:#ffffff18;margin:12px 0}.switchline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.switchline input{width:auto}.rowbtn{background:transparent;color:#c7b7ff;border:1px solid #4c4979;border-radius:8px;padding:7px 10px;font-size:11px}.bar{height:5px;background:#303552;border-radius:8px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:#43d6bb}.no-scroll{overflow:hidden} @media(min-width:740px){main{padding:30px 25px 125px}.stats{grid-template-columns:repeat(4,1fr)}.sheet{align-self:center;border-radius:20px;max-height:85vh}nav{max-width:700px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}
</style></head><body>
<header><div class="brand"><div class="logo">✦</div><div><h1>PostFlow Studio</h1><small>SMART SOCIAL SCHEDULER</small></div></div><div class="circle" onclick="route('events')">♧</div></header>
<main id="page"></main><nav id="nav"></nav><div id="overlay"></div><div id="toast" class="toast hidden"></div><script src="jszip.min.js"></script><script>
const TZ='Asia/Kolkata',DEST=[['ig_feed','Instagram Feed'],['ig_story','Instagram Story'],['fb_feed','Facebook Feed'],['fb_story','Facebook Story'],['gbp_update','Google Business Profile'],['wa_reminder','WhatsApp Share Reminder']];
const FESTIVALS_2026=[{"id":"festival2026_0","title":"Maha Shivratri","date":"2026-02-15","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_1","title":"Chhatrapati Shivaji Maharaj Jayanti","date":"2026-02-19","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_2","title":"Holi (Maharashtra observed)","date":"2026-03-03","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_3","title":"Gudi Padwa","date":"2026-03-19","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_4","title":"Eid al-Fitr (Maharashtra notified)","date":"2026-03-21","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_5","title":"Ram Navami","date":"2026-03-26","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_6","title":"Mahavir Jayanti","date":"2026-03-31","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_7","title":"Good Friday","date":"2026-04-03","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_8","title":"Ambedkar Jayanti","date":"2026-04-14","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_9","title":"Maharashtra Day","date":"2026-05-01","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_10","title":"Buddha Purnima","date":"2026-05-01","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_11","title":"Bakrid (Maharashtra notified)","date":"2026-05-28","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_12","title":"Muharram (Maharashtra notified)","date":"2026-06-26","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_13","title":"Parsi New Year","date":"2026-08-15","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_14","title":"Eid-e-Milad","date":"2026-08-26","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_15","title":"Raksha Bandhan","date":"2026-08-28","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_16","title":"Janmashtami","date":"2026-09-04","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_17","title":"Ganesh Chaturthi","date":"2026-09-14","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_18","title":"Dussehra","date":"2026-10-20","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_19","title":"Diwali Lakshmi Puja","date":"2026-11-08","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_20","title":"Diwali Balipratipada","date":"2026-11-10","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"},{"id":"festival2026_21","title":"Guru Nanak Jayanti","date":"2026-11-24","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"}];
const K='postflow_android_v3',defaultStore={posts:[],events:FESTIVALS_2026,imports:[],accounts:[],settings:{time:'09:00',notifications:true,reminderDays:[7,1,0],captionLanguage:'en',defaultTargets:['ig_feed'],mediaLimitMB:100}};
let state=load(),page='home',calMonth=new Date(),selectedDay='',editing=null,importMode='auto',bulkMode=false,bulkSelected=new Set();
function load(){let base=JSON.parse(JSON.stringify(defaultStore));try{let raw=window.PostFlowNative?.getState?.()||'{}';if(raw==='{}')raw=localStorage.getItem(K)||'{}';let found=JSON.parse(raw);return {...base,...found,settings:{...base.settings,...(found.settings||{})}}}catch(e){return base}}
function save(){const json=JSON.stringify(state);let stored=false;try{localStorage.setItem(K,json);stored=true}catch(e){console.warn('Browser local storage unavailable',e)}try{if(window.PostFlowNative?.syncState){PostFlowNative.syncState(json);stored=true}}catch(e){console.error('Android storage unavailable',e)}if(!stored)toast('Unable to save. Export backup and free storage.');return stored}
function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function dateLocal(d=new Date()){let a=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);let g=t=>a.find(p=>p.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`}
function addDays(s,n){let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function fmt(s){if(!s)return'Unknown date';let d=new Date(s+'T12:00:00Z');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function due(p){return p.status==='scheduled' && (p.date<dateLocal()||(p.date===dateLocal()&&p.time <= new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())))}
function counts(){return{scheduled:state.posts.filter(x=>x.status==='scheduled'&&!due(x)).length,drafts:state.posts.filter(x=>x.status==='draft').length,due:state.posts.filter(x=>due(x)).length,events:state.events.length}}
function notifyDue(){if(state.settings.notifications){let d=state.posts.filter(due).length;if(d)toast(`${d} post(s) need publishing action. API auto-posting is not connected.`)}}
function route(p){page=p;render();window.scrollTo(0,0)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2900)}
function btn(label,fn,cls='secondary'){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function media(p){return p.thumb?`<img class="thumb" src="${p.thumb}">`:`<div class="thumb">${p.kind==='reel'?'▶':'▧'}</div>`}
function tag(p){return p.status==='draft'?'<span class="tag">Draft</span>':p.status==='paused'?'<span class="tag red">Paused</span>':due(p)?'<span class="tag red">Needs action</span>':p.status==='manually_posted'?'<span class="tag green">Manual ✓</span>':'<span class="tag green">Scheduled</span>'}
function postItem(p){return `<div class="item" onclick="${bulkMode?`toggleBulk('${p.id}')`:`editPost('${p.id}')`}">${bulkMode?`<input type="checkbox" aria-label="Select post" style="width:20px;min-width:20px;accent-color:#987bff" ${bulkSelected.has(p.id)?'checked':''} onclick="event.stopPropagation();toggleBulk('${p.id}')">`:''}${media(p)}<div class="body"><b>${esc(p.title||'Untitled Post')}</b><small>${fmt(p.date)} • ${esc(p.time||'09:00')} IST</small><small>${(p.targets||[]).length} channel(s) • ${Object.keys(p.accountTargets||{}).length} selected account(s)</small></div>${tag(p)}</div>`}
function eventItem(ev){return `<div class="item" onclick="editEvent('${ev.id}')"><div class="thumb">${ev.type==='birthday'?'🎂':ev.type==='festival'?'🪔':'📆'}</div><div class="body"><b>${esc(ev.title)}</b><small>${fmt(ev.date)}${ev.repeat?' • Yearly':''}</small></div><span class="tag">${esc(ev.type)}</span></div>`}
function navRender(){let data=[['home','⌂','Home'],['calendar','▦','Calendar'],['compose','⊕','Create'],['library','▧','Library'],['events','♧','Events']];document.getElementById('nav').innerHTML=data.map(([id,ico,t])=>`<button class="navItem ${page===id?'active':''}" onclick="${id==='compose'?`compose()`:`route('${id}')`}"><span class="ico">${ico}</span>${t}</button>`).join('')}
function render(){navRender();const el=document.getElementById('page');let c=counts();if(page==='home'){let up=[...state.posts].filter(x=>x.status==='scheduled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5),events=nextEvents().slice(0,3);el.innerHTML=`<div class="topline"><div><h2>Good to see you ✨</h2><p class="sub">Plan once. Stay in control of every post.</p></div><span class="chip">● Local planner</span></div><div class="stats"><div class="stat"><small>Scheduled</small><i>◷</i><b>${c.scheduled}</b></div><div class="stat"><small>Needs action</small><i>!</i><b>${c.due}</b></div><div class="stat"><small>Drafts</small><i>▤</i><b>${c.drafts}</b></div><div class="stat"><small>Events</small><i>♧</i><b>${c.events}</b></div></div><div class="section"><h3>Quick actions</h3></div><div class="layout-actions">${btn('＋ Create Post','compose()','')}${btn('▣ Import ZIP',"route('library');openZip()")}</div><div class="section"><h3>Upcoming Posts</h3><a onclick="route('queue')">View all →</a></div><div class="card">${up.length?up.map(postItem).join(''):'<div class="empty">No posts yet.<br>Import a dated ZIP or create your first post.</div>'}</div><div class="section"><h3>Festival & Birthday Calendar</h3><a onclick="route('events')">All events →</a></div><div class="card">${events.length?events.map(eventItem).join(''):'<div class="empty">No events added yet.</div>'}</div><div class="section"><h3>Connected platforms</h3></div><div class="card"><div class="item"><div class="thumb">◎</div><div class="body"><b>Instagram / Facebook / Google</b><small>Official API accounts not yet connected</small></div><span class="tag red">Pending</span></div><div class="note">Local scheduling and Android reminder alarms are included. Automatic posting to social networks requires official OAuth and the future cloud integration.</div></div><div class="section"><h3>More</h3></div><div class="actions">${btn('Post Queue',"route('queue')")}${btn('Settings',"route('settings')")}${btn('Accounts',"route('accounts')")}</div>`}
else if(page==='queue'){let posts=[...state.posts].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));el.innerHTML=`<h2>Post Queue</h2><p class="sub">Manage, pause, edit and manually share posts.</p><div class="actions">${btn('＋ New Post','compose()','')}${btn('View Calendar',"route('calendar')")}</div><div class="section"><h3>${posts.length} Posts</h3><a onclick="setBulkMode(!bulkMode)">${bulkMode?'Cancel selection':'☑ Bulk Select'}</a></div>${bulkMode?'<div class="card" style="margin-bottom:12px"><div class="topline"><b>'+bulkSelected.size+' selected</b><a onclick="bulkSelectAll()">Select all</a></div><div class="actions" style="margin-top:12px">'+btn('Pause selected','bulkChangeStatus("paused")','mini')+btn('Resume selected','bulkChangeStatus("scheduled")','mini')+btn('Edit selected','bulkEdit()','mini')+btn('Delete selected','bulkDelete()','mini secondary')+'</div></div>':''}<div class="card">${posts.length?posts.map(postItem).join(''):'<div class="empty">Your queue is empty.</div>'}</div>`}
else if(page==='calendar')calendarRender(el);
else if(page==='library'){el.innerHTML=`<h2>Smart ZIP Library</h2><p class="sub">Upload dated festivals, promotions, posters or Reels. Valid items are automatically scheduled at ${esc(state.settings.time)} IST.</p><div class="banner"><div><b>Auto Schedule from ZIP</b><small>Date detection · Caption suggestions<br>Duplicate checks · Manual edits</small></div>${btn('Upload ZIP','openZip()','')}</div><div class="section"><h3>ZIP Imports</h3></div><div class="card">${state.imports.length?state.imports.map(i=>`<div class="item"><div class="thumb">▣</div><div class="body"><b>${esc(i.name)}</b><small>${esc(i.imported)} • ${i.added} added • ${i.duplicates} duplicates</small></div></div>`).join(''):'<div class="empty">No ZIP files imported.</div>'}</div><div class="section"><h3>Media & Posts</h3><a onclick="route('queue')">Queue →</a></div><div class="card">${state.posts.length?state.posts.slice().reverse().map(postItem).join(''):'<div class="empty">Upload your content to get started.</div>'}</div>`}
else if(page==='events'){let evs=nextEvents();el.innerHTML=`<h2>Festivals & Events</h2><p class="sub">2026 Maharashtra festival dates included; add your own occasions, client birthdays and reminders. Festival dates for other years should be verified.</p><div class="actions">${btn('＋ Add Event','editEvent()','')}${btn('Add Fixed Indian Days','seedIndianDays()')}${btn('Calendar',"route('calendar')")}</div><div class="section"><h3>Upcoming Events</h3></div><div class="card">${evs.length?evs.map(eventItem).join(''):'<div class="empty">Add your first festival or birthday.</div>'}</div><div class="section"><h3>Quick note</h3></div><div class="note">Yearly birthdays repeat automatically. Indian lunar festivals may change date every year and should be verified annually. Android notifications and home-screen Festival Widget are included in the native app project. Add the widget from your launcher after installation.</div>`}
else if(page==='accounts'){el.innerHTML=`<h2>Social Accounts</h2><p class="sub">Organize account names for scheduling, then connect official APIs in the cloud release.</p><div class="note">Account labels below are for planning only. They do not authorize publishing. Never enter your social media passwords here.</div><div class="section"><h3>Accounts</h3>${btn('＋ Add Label','addAccount()','secondary')}</div><div class="card">${state.accounts.length?state.accounts.map(a=>`<div class="item"><div class="thumb">◎</div><div class="body"><b>${esc(a.name)}</b><small>${esc(a.platform)} • Not connected</small></div><button class="rowbtn" onclick="deleteAccount('${a.id}')">Remove</button></div>`).join(''):'<div class="empty">No account labels yet.</div>'}</div>`}
else if(page==='settings'){el.innerHTML=`<h2>Settings</h2><p class="sub">Personal automation and Android notification preferences.</p>
<div class="card"><div class="field"><label>Default posting time • Asia/Kolkata (IST)</label><input id="prefTime" type="time" value="${esc(state.settings.time)}"></div>
<div class="field"><label>Caption suggestion language</label><select id="prefLanguage"><option value="en" ${state.settings.captionLanguage==='en'?'selected':''}>English</option><option value="hi" ${state.settings.captionLanguage==='hi'?'selected':''}>Hindi</option><option value="mr" ${state.settings.captionLanguage==='mr'?'selected':''}>Marathi</option></select></div>
<div class="switchline"><span>Local festival & post reminders</span><input id="prefNote" type="checkbox" ${state.settings.notifications?'checked':''}></div>
<div class="section"><h3>Festival & Birthday Reminder Days</h3></div>
${[[7,'7 days before'],[1,'1 day before'],[0,'Event day']].map(([n,l])=>`<div class="check"><input type="checkbox" id="rem_${n}" ${(state.settings.reminderDays||[]).includes(n)?'checked':''}><label for="rem_${n}">${l} • 9:00 AM IST</label></div>`).join('')}
<div class="section"><h3>Default Destinations on New Posts</h3></div><p class="sub">Overrides available on every individual post.</p>

async function thumbnail(bytes,mime){return new Promise(resolve=>{if(!mime.startsWith('image/'))return resolve('');let blob=new Blob([bytes],{type:mime}),u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,160/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);let ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.58))};im.onerror=()=>{URL.revokeObjectURL(u);resolve('')};im.src=u})}
function safeFileName(name){return String(name||'media').split('/').pop().slice(0,160)}
function base64Chunk(bytes){let result='';for(let i=0;i<bytes.length;i++)result+=String.fromCharCode(bytes[i]);return btoa(result)}
async function persistMedia(id,name,bytes){
 try{
   if(window.PostFlowNative?.beginMedia){
     if(!PostFlowNative.beginMedia(id,safeFileName(name)))return false;
     let success=false;
     try{
       for(let i=0;i<bytes.length;i+=192*1024){
         let encoded=base64Chunk(bytes.subarray(i,i+192*1024));
         if(!PostFlowNative.appendMedia(id,encoded))throw Error('Storage write failed');
         if(i%(192*1024*12)===0)await new Promise(ok=>setTimeout(ok,0));
       }
       success=true;
       return true;
     }finally{PostFlowNative.finishMedia(id,success)}
   }
   // Web-browser preview/testing: persist a Blob in IndexedDB rather than localStorage.
   return await storeWebMedia(id,new Blob([bytes],{type:/\.mp4$/i.test(name)?'video/mp4':/\.png$/i.test(name)?'image/png':'image/jpeg'}));
 }catch(e){console.error('Media persistence error',e);return false}
}
function cleanupMedia(id){if(window.PostFlowNative?.deleteMedia)PostFlowNative.deleteMedia(id);else mediaDB().then(db=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=()=>db.close()}).catch(()=>{})}
function mediaDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('postflow-local-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeWebMedia(id,blob){try{let db=await mediaDB();return await new Promise(ok=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').put(blob,id);tx.oncomplete=()=>{db.close();ok(true)};tx.onerror=()=>{db.close();ok(false)}})}catch(e){return false}}
async function retrieveWebMedia(id){try{let db=await mediaDB();return await new Promise(resolve=>{let r=db.transaction('media').objectStore('media').get(id);r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();resolve(null)}})}catch(e){return null}}
function csvRows(text){
 let rows=[],row=[],col='',quoted=false;
 for(let i=0;i<text.length;i++){
   let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){col+='"';i++}else quoted=!quoted}
   else if(c===','&&!quoted){row.push(col);col=''}
   else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(col);if(row.some(Boolean))rows.push(row);row=[];col=''}
   else col+=c;
 }
 row.push(col);if(row.some(Boolean))rows.push(row);
 if(rows.length<2)return {};
 let headers=rows.shift().map(x=>x.trim().toLowerCase()),out={};
 for(let parts of rows){let r={};headers.forEach((h,i)=>r[h]=parts[i]?.trim()||'');let name=r.file||r.filename||r.path;if(name)out[name.replaceAll('\\','/')]=r;}
 return out;
}

async function processZip(){
 const file=document.getElementById('zipInput').files[0],mode=document.getElementById('zipMode').value,targets=DEST.map(x=>x[0]).filter(k=>document.getElementById('zip_'+k).checked);
 if(!file){toast('Choose ZIP file');return}
 if(file.size>200*1024*1024){toast('ZIP limit 200 MB');return}
 if(!window.JSZip){toast('ZIP library missing');return}
 const control=document.querySelector('#overlay .btn.full');if(control){control.disabled=true;control.textContent='Importing…'}
 let added=0,duplicates=0,review=0,skipped=0;
 try{
   let zip=await JSZip.loadAsync(file,{checkCRC32:true});
   let entries=Object.values(zip.files).filter(e=>!e.dir && /\.(png|jpe?g|webp|mp4|mov)$/i.test(e.name) && !e.name.startsWith('__MACOSX/'));
   if(entries.length>250)throw Error('ZIP maximum 250 media files');
   let compressedSize=entries.reduce((s,e)=>s+(e._data?.uncompressedSize||0),0);
   if(compressedSize>500*1024*1024)throw Error('Extracted media exceeds 500 MB');
   let csv=Object.values(zip.files).find(e=>!e.dir && /(^|\/)manifest\.csv$/i.test(e.name));
   let manifest=csv?csvRows(await csv.async('text')):{};
   let seen=new Set(state.posts.map(p=>p.fingerprint).filter(Boolean));
   let times=new Set(state.posts.filter(p=>p.status==='scheduled').map(p=>p.date+'|'+p.time));
   for(let f of entries){
     if((f._data?.uncompressedSize||0)>100*1024*1024){skipped++;continue}
     let bytes=await f.async('uint8array');if(bytes.length>100*1024*1024){skipped++;continue}
     let crc=f._data?.crc32??bytes.reduce((h,b)=>((h*33)^b)>>>0,5381),fingerprint=bytes.length+':'+crc;
     if(seen.has(fingerprint)){duplicates++;continue}seen.add(fingerprint);
     let meta=manifest[f.name]||manifest[safeFileName(f.name)]||{};
     let date=parseManifestDate(meta.date)||guessDate(f.name),category=meta.category||pickCategory(f.name);
     let title=meta.title||titleFromName(f.name),video=/\.(mp4|mov)$/i.test(f.name);
     let mime=video?'video/mp4':/\.png$/i.test(f.name)?'image/png':/\.webp$/i.test(f.name)?'image/webp':'image/jpeg';
     let mediaId=uid(),written=await persistMedia(mediaId,safeFileName(f.name),bytes);
     if(!written){skipped++;continue}
     let thumb=video?'':await thumbnail(bytes,mime);
     let time=/^([01]\d|2[0-3]):[0-5]\d$/.test(meta.time||'')?meta.time:state.settings.time;
     let selected=(meta.destinations||meta.targets)?String(meta.destinations||meta.targets).split(/[|;]/).map(t=>t.trim()).filter(t=>DEST.some(d=>d[0]===t)):targets;
     let shouldSchedule=mode==='auto'&&date&&date>=dateLocal()&&category!=='birthday'&&selected.length>0;
     if(shouldSchedule){while(times.has(date+'|'+time)){
       let [h,m]=time.split(':').map(Number),newMin=h*60+m+15;
       if(newMin>=1440){shouldSchedule=false;break}
       time=String(Math.floor(newMin/60)).padStart(2,'0')+':'+String(newMin%60).padStart(2,'0');
     }if(shouldSchedule)times.add(date+'|'+time)}
     if(!shouldSchedule)review++;
     state.posts.push({id:uid(),title,caption:meta.caption||makeCaption(title,category),kind:video?'reel':'image',date:date||dateLocal(),time,targets:[...selected],accountTargets:{},status:shouldSchedule?'scheduled':'draft',thumb,fingerprint,origin:file.name,category,mediaId,mediaName:safeFileName(f.name)});
     added++;
     if(category==='festival'&&date&&!state.events.some(e=>e.title.toLowerCase()===title.toLowerCase()&&e.date===date))
       state.events.push({id:uid(),title,date,type:'festival',repeat:false,private:false});
   }
   state.imports.unshift({id:uid(),name:file.name,imported:new Date().toLocaleDateString('en-IN'),added,duplicates,skipped,review});
   save();closeModal();route('library');toast(`Imported ${added}; skipped ${duplicates} duplicates, ${skipped} unsupported/large`);
 }catch(e){toast('Import failed: '+String(e.message).slice(0,95));console.error(e)}
 finally{if(control){control.disabled=false;control.textContent='Import and Process ZIP'}}
}
function saveSettings(){let t=document.getElementById('prefTime').value;if(!t)return;
 state.settings.time=t;state.settings.notifications=document.getElementById('prefNote').checked;
 state.settings.captionLanguage=document.getElementById('prefLanguage').value;
 state.settings.reminderDays=[7,1,0].filter(n=>document.getElementById('rem_'+n).checked);
 state.settings.defaultTargets=DEST.map(d=>d[0]).filter(k=>document.getElementById('def_'+k).checked);
 save();toast('All preferences saved. Android reminders updated.')}
function addAccount(){showModal({title:'Add Account Label',body:`<p class="sub">Planning label only. Social authorization is not included.</p><div class="field"><label>Platform</label><select id="aPlatform"><option>Instagram</option><option>Facebook Pages</option><option>Google Business Profile</option></select></div><div class="field"><label>Page / Profile Name</label><input id="aName" placeholder="My Business Page"></div>${btn('Add Label','saveAccount()','full')}`})}function saveAccount(){let name=document.getElementById('aName').value.trim();if(!name){toast('Name required');return}state.accounts.push({id:uid(),name,platform:document.getElementById('aPlatform').value});save();closeModal();render()}function deleteAccount(id){state.accounts=state.accounts.filter(a=>a.id!==id);save();render()}
function exportBackup(){if(window.PostFlowNative?.exportBackup)PostFlowNative.exportBackup();else exportJsonBackup()}
function importNativeBackup(){if(window.PostFlowNative?.importBackup)PostFlowNative.importBackup();else importBackup()}
function exportJsonBackup(){let blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='postflow-metadata-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Settings-only backup exported. Original media not included.')}
function importBackup(){showModal({title:'Restore JSON Backup',body:`<div class="note">Restoring replaces current posts/events. JSON file does NOT contain original media.</div><div class="field"><input type="file" id="backupFile" accept=".json,application/json"></div>${btn('Restore JSON','restoreBackup()','full')}`})}
async function restoreBackup(){let f=document.getElementById('backupFile').files[0];if(!f)return;if(!confirm('Replace all existing local data?'))return;try{let a=JSON.parse(await f.text());if(!a.state||!Array.isArray(a.state.posts)||!Array.isArray(a.state.events))throw Error('Invalid backup');state={...JSON.parse(JSON.stringify(defaultStore)),...a.state};save();closeModal();route('home');toast('Metadata restored')}catch(e){toast('Invalid backup file')}}
window.applyNativeRestoredState=function(json){try{let restored=JSON.parse(json);if(!Array.isArray(restored.posts)||!Array.isArray(restored.events))throw Error('Invalid data');state={...JSON.parse(JSON.stringify(defaultStore)),...restored};save();closeModal();route('home');toast('Posts, events and full media backup restored')}catch(e){toast('Restore display error')}};
render();if(window.PostFlowNative&&PostFlowNative.syncState){try{PostFlowNative.syncState(JSON.stringify(state))}catch(e){}}setTimeout(()=>{let upcoming=nextEvents().filter(e=>e.viewDate===dateLocal());if(upcoming.length&&state.settings.notifications)toast('Today: '+upcoming.map(e=>e.title).slice(0,2).join(', '));else notifyDue()},700);
</script></body></html>
