/* V6 design system: accessible system/light/dark palette */
:root{--soft:#1c2440;--input:#171e33;--modal:#131b30;--navbg:#11182bd9;--fieldtext:#f5f7ff;--surface:#151b31;--stroke:#303957;--accent:#9779ff;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f6fa;--card:#ffffff;--line:#dfe4ee;--border:#d7ddeb;--text:#1d2537;--muted:#616d82;--soft:#eef0f9;--input:#fff;--modal:#fff;--navbg:#fffffff1;--fieldtext:#1d2537;--surface:#fff;--stroke:#d7ddeb;--primary:#674af0;--green:#17856f;--red:#ca455c;--accent:#644ce6}
body{background:var(--bg)!important;color:var(--text)}
header,nav{background:var(--navbg)!important;border-color:var(--line)!important}
.stat,.card,.sheet{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--line)!important;box-shadow:0 8px 28px #0c133015}
h1,h2,h3,b,label,.body{color:var(--text)}
.sheet{background:var(--modal)!important}
.item{border-color:var(--line)!important}
input,select,textarea{background:var(--input)!important;color:var(--fieldtext)!important;border:1px solid var(--line)!important}
.btn.secondary,.rowbtn{background:var(--soft)!important;color:var(--text)!important;border-color:var(--line)!important}
.note,.empty{background:var(--soft)!important;color:var(--muted)!important;border-color:var(--line)!important}
.tag{background:var(--soft);color:var(--primary)}
:root[data-theme="light"] .chip{background:#edeaff;color:#4d37be}
:root[data-theme="light"] .tag.green{background:#e0f8ee;color:#126b4d}
:root[data-theme="light"] .tag.red{background:#ffe5e9;color:#ad3146}
:root[data-theme="light"] .thumb{background:#edf0fa}
:root[data-theme="light"] .navItem{color:#67738a}
:root[data-theme="light"] .navItem.active{color:#563bd5}
:root[data-theme="light"] small,:root[data-theme="light"] .sub{color:var(--muted)}
.btn{transition:transform .18s ease,background .18s ease,opacity .18s ease}
.btn:active{transform:scale(.98)}
.card,.stat{border-radius:19px}
.wizard-head{padding:10px 0 14px}
.wizard-steps{display:flex;gap:7px;align-items:center;margin:12px 0}
.wizard-pip{height:5px;flex:1;background:var(--line);border-radius:5px}
.wizard-pip.active{background:var(--primary)}
.wizard-count{font-size:12px;font-weight:700;color:var(--muted)}
.wizard-actions{position:sticky;bottom:-2px;z-index:2;background:var(--modal);display:flex;gap:10px;padding:14px 0 5px;border-top:1px solid var(--line)}
.wizard-actions button{flex:1}
.composer-stage[hidden]{display:none!important}
.carousel-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}
.carousel-tile{position:relative;overflow:hidden;border-radius:12px;background:var(--soft);aspect-ratio:1;border:1px solid var(--line)}
.carousel-tile img{width:100%;height:100%;object-fit:cover}
.carousel-tile .tile-order{position:absolute;top:4px;left:4px;background:#24194dcc;color:white;border-radius:30px;padding:3px 7px;font-size:10px}
.carousel-tile .tile-controls{position:absolute;bottom:2px;right:2px;display:flex;gap:3px}
.carousel-tile button{border:0;border-radius:6px;background:#1c234ce8;color:#fff;padding:4px 6px;font-size:12px}
.detail-error{border:1px solid #da7582;border-radius:14px;padding:14px;background:color-mix(in srgb,var(--red) 9%,var(--card));margin:12px 0}
.detail-error strong{color:var(--red)}
.navItem{transition:background .18s ease}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

.hero-create{padding:22px!important;background:linear-gradient(115deg,var(--surface),var(--soft))!important;margin-bottom:16px}
.hero-create>b{font-size:19px}
.hero-create>.sub{margin:7px 0 17px}
.compact-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

@media(max-width:365px){.compact-stats .stat b{font-size:23px}}

/* PostFlow Fluid UI v7.1 — lightweight premium visual language */
:root{--bg:#0b0e17;--card:#181d2b;--surface:#181d2b;--soft:#23283a;--modal:#171b29;--input:#202638;--navbg:#141824ef;--line:#30364a;--border:#30364a;--text:#f4f2fa;--fieldtext:#f4f2fa;--muted:#a0a6bc;--primary:#b7a0fd;--accent:#b7a0fd;--green:#67d3aa;--red:#ff829d;--stroke:#343a50}
:root[data-theme="light"]{--bg:#f4f3f8;--card:#ffffff;--surface:#ffffff;--soft:#efedf7;--modal:#ffffff;--input:#f9f8fc;--navbg:#ffffffed;--line:#e2dfee;--border:#e2dfee;--text:#201d2e;--fieldtext:#201d2e;--muted:#6c6c80;--primary:#7051cc;--accent:#7051cc;--green:#248970;--red:#c94468;--stroke:#e2dfee}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:-.1px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body:before{content:"";position:fixed;z-index:-1;top:0;left:0;right:0;height:290px;background:radial-gradient(ellipse at 80% -28%,#8570c01b,transparent 70%);pointer-events:none}
header{padding:calc(11px + env(safe-area-inset-top)) 19px 11px!important;background:color-mix(in srgb,var(--bg) 88%,transparent)!important;border-color:color-mix(in srgb,var(--line) 65%,transparent)!important;transition:padding .24s ease,background .24s ease;min-height:69px}
header .logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#49416b,#28253e);color:#e3d4ff;font-size:21px;box-shadow:0 2px 12px #00000010}
header h1{font-size:16px;letter-spacing:-.55px;font-weight:800}
header small{font-size:9px;letter-spacing:1.4px}
header .circle{height:39px;width:39px;border-radius:13px;border:1px solid var(--line);color:var(--text);background:var(--card)}
header .circle:active{transform:scale(.94)}
header.is-scrolled{padding-top:calc(7px + env(safe-area-inset-top))!important;padding-bottom:7px!important}
header.is-scrolled .logo{height:35px;width:35px}
main{padding:23px 18px calc(115px + env(safe-area-inset-bottom));max-width:780px;min-height:76vh}
h2{font-size:27px;line-height:1.15;letter-spacing:-1.05px;font-weight:800}p.sub{font-size:12.5px;line-height:1.65;color:var(--muted)}
.section{margin:27px 0 13px}.section h3{font-size:16px;letter-spacing:-.3px}
.section a,.link{color:var(--primary)}
.stat,.card,.sheet{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important;border-radius:20px!important}
.card{padding:17px}.stat{padding:17px}.stat b{font-weight:800}
.item{gap:12px;padding:14px 0;transition:background .18s ease,transform .18s ease;cursor:pointer}
.item:active{transform:scale(.985)}
.item .body b{font-size:13.5px;font-weight:700}
.item .body small{line-height:1.5}
.thumb{width:60px;height:69px;min-width:60px;border-radius:13px;object-fit:cover;background:var(--soft)}
.btn{border-radius:13px;min-height:43px;background:#8365df;color:#fff;padding:12px 17px;font-size:12.5px;letter-spacing:-.15px;font-weight:750;transition:transform .17s cubic-bezier(.2,.85,.2,1),background .17s,opacity .17s}
.btn:active{transform:scale(.965)}.btn.secondary,.rowbtn{background:var(--soft)!important;border:1px solid var(--line)!important;color:var(--text)!important}
.btn.mini{min-height:33px}.rowbtn{border-radius:12px;min-height:34px}
input,textarea,select{border-radius:13px!important;min-height:46px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
nav{bottom:calc(9px + env(safe-area-inset-bottom));left:12px;right:12px;border:1px solid color-mix(in srgb,var(--line) 90%,transparent)!important;border-radius:24px!important;padding:7px!important;background:color-mix(in srgb,var(--card) 94%,transparent)!important;box-shadow:0 9px 40px #0005;justify-content:space-between;max-width:700px;margin:0 auto}
.navItem{width:20%;min-height:54px;border-radius:17px;padding:7px 1px 5px;color:var(--muted);transition:background .22s ease,transform .18s ease,color .2s ease}
.navItem .ico{font-size:21px;line-height:24px;transition:transform .22s cubic-bezier(.25,1.8,.5,1)}
.navItem.active{background:color-mix(in srgb,var(--primary) 17%,var(--surface));color:var(--primary);font-weight:800}
.navItem.active .ico{transform:translateY(-1px) scale(1.08)}
.navItem:active{transform:scale(.94)}
.navItem.create-nav{position:relative}.navItem.create-nav .ico{background:#8768df;color:white;border-radius:14px;display:grid;place-items:center;min-width:35px;min-height:35px;margin-top:-12px;box-shadow:0 5px 16px #6654bb65}.navItem.create-nav{color:var(--text)}.navItem.create-nav.active{background:transparent}
#page.page-enter{animation:pfPageIn .3s cubic-bezier(.2,.8,.25,1) both}
@keyframes pfPageIn{from{opacity:.55;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.modal{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:pfFade .18s ease both}
.sheet{box-shadow:0 -17px 75px #0006!important;border-radius:27px 27px 0 0!important;animation:pfSheetIn .27s cubic-bezier(.18,.88,.26,1.02) both;overscroll-behavior:contain}
@keyframes pfFade{from{opacity:0}to{opacity:1}}@keyframes pfSheetIn{from{transform:translateY(25px);opacity:.65}to{transform:translateY(0);opacity:1}}
.sheet-head{position:sticky;top:-20px;padding:14px 0 12px;background:var(--modal);z-index:3;border-bottom:1px solid var(--line);margin-bottom:14px}
.day{border-radius:12px;min-height:52px;background:var(--soft);border-color:var(--line);transition:background .18s,transform .18s}.day:active{transform:scale(.92)}
.day.selected{background:color-mix(in srgb,var(--primary) 42%,var(--card));border-color:var(--primary)}
.tag{font-weight:650;border-radius:9px;font-size:10px}
.workspace-pill{display:flex;align-items:center;gap:10px;width:fit-content;max-width:100%;padding:8px 11px 8px 8px!important;margin:0 0 19px!important;border-radius:999px!important;font-size:12px!important;font-weight:700;background:var(--soft)!important;color:var(--text)!important;border:1px solid var(--line)!important;min-height:41px;box-shadow:none}
.workspace-avatar{height:25px;width:25px;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(135deg,#7362a3,#3b375f);color:#fff;font-size:11px;flex:none}
.workspace-pill .workspace-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.workspace-caret{font-size:13px;color:var(--muted)}
.pf-eyebrow{text-transform:uppercase;font-size:10px;color:var(--primary);font-weight:800;letter-spacing:1.45px;margin-bottom:8px}
.pf-hero-title{font-size:clamp(30px,7vw,43px);line-height:1.03;letter-spacing:-1.7px;font-weight:840;margin:0}
.pf-hero-title span{color:var(--primary)}
.pf-hero-copy{color:var(--muted);font-size:13px;line-height:1.7;margin:10px 0 0}
.pf-intro{margin:3px 0 21px}
.pf-feature{position:relative;overflow:hidden;background:linear-gradient(128deg,#353048 0%,#24293c 59%,#202736 100%)!important;color:#f8f5ff!important;border:1px solid #5f587344!important;border-radius:24px!important;padding:23px!important}
.pf-feature:after{content:"✦";position:absolute;right:-3px;top:-34px;font-size:136px;opacity:.08;transform:rotate(-13deg);pointer-events:none}
.pf-feature small{color:#bab4d0!important;text-transform:uppercase;letter-spacing:1.2px;font-size:10px;font-weight:700}
.pf-feature h3{color:#fff;font-size:22px;line-height:1.2;letter-spacing:-.6px;margin:9px 0}
.pf-feature p{color:#c8c4d6;font-size:12px;line-height:1.65;max-width:250px}
.pf-feature .btn{background:#d9c9ff;color:#291e42}
.pf-feature .btn.secondary{background:#ffffff12!important;border:1px solid #ffffff25!important;color:#fff!important}
.pf-feature .actions{position:relative;z-index:1;margin-top:21px}
.pf-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:17px 0 4px}
.pf-metric{padding:14px 10px;background:var(--card);border:1px solid var(--line);border-radius:17px;text-align:left}
.pf-metric strong{display:block;font-size:25px;letter-spacing:-1.2px;font-weight:800;color:var(--text)}
.pf-metric small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:5px}
.pf-metric .pf-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary);margin-right:5px}
.pf-metric .pf-dot.success{background:var(--green)}.pf-metric .pf-dot.danger{background:var(--red)}
.pf-quick-row{display:flex;gap:10px;align-items:center;margin-top:14px}
.pf-quick-row .btn{flex:1}
.pf-upcoming{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 2px 10px;margin:0 -2px;scrollbar-width:none}
.pf-upcoming::-webkit-scrollbar{display:none}
.pf-post-card{min-width:min(260px,76vw);max-width:320px;scroll-snap-align:start;display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:19px;padding:11px;cursor:pointer;transition:transform .18s}
.pf-post-card:active{transform:scale(.97)}.pf-post-card .thumb{width:66px;min-width:66px;height:83px;border-radius:12px}
.pf-post-card .pf-post-copy{min-width:0;flex:1}.pf-post-card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-size:13px}
.pf-post-card small{display:block;color:var(--muted);font-size:11px;margin:8px 0;line-height:1.4}

function tenMinutesIST(){
 const future=new Date(Date.now()+10*60*1000+330*60*1000).toISOString();

function dateLocal(d=new Date()){let a=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);let g=t=>a.find(p=>p.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`}
function addDays(s,n){let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

function validScheduleIST(date,time,minLeadSeconds=120){
 if(!validFestivalDateTime(String(date||''),String(time||'')))return {ok:false,message:'Choose a valid date and time (IST).'};
 const when=Math.floor(Date.parse(date+'T'+time+':00+05:30')/1000);
 const now=Math.floor(Date.now()/1000);
 if(when<now+minLeadSeconds)return {ok:false,message:'Selected '+date+' '+time+' IST is in the past or less than 2 minutes away. Current time: '+new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'})+'.'};
 return {ok:true,when};
}

 if(date)date.value=d.slice(0,10);if(time)time.value=d.slice(11,16);syncReviewSchedule();

function localPublishingJobs(post){
 return Object.values(state.wpPendingJobs||{}).filter(j=>j.postId===post.id);
}
function postTrackingState(post){
 const jobs=localPublishingJobs(post);
 const localIds=Object.entries(state.wpPendingJobs||{}).filter(([,v])=>v.postId===post.id).map(([key])=>key);
 const serverJobs=(state.wpServerJobs||[]).filter(j=>jobs.some(k=>Number(k.serverId||0)===Number(j.id))||(j.client_job_id&&localIds.includes(String(j.client_job_id))));
 if(!jobs.length)return null;
 if(serverJobs.some(j=>['failed','attention','error'].includes(j.status))&&serverJobs.some(j=>j.status==='published'&&j.verification_status==='verified'))return 'partial';
 if(serverJobs.length>=jobs.length&&serverJobs.every(j=>j.status==='published'&&j.verification_status==='verified'))return 'published';
 if(serverJobs.some(j=>j.status==='awaiting_verification'||(j.status==='published'&&j.verification_status!=='verified')))return 'verification';
 if(serverJobs.some(j=>j.status==='failed'||j.status==='attention'||j.status==='error'))return 'failed';
 if(jobs.some(j=>['uploading','pending','upload_requested'].includes(j.status)))return 'uploading';
 if(serverJobs.some(j=>j.status==='processing')||jobs.some(j=>j.status==='processing'))return 'processing';
 if(serverJobs.some(j=>j.status==='scheduled')||jobs.some(j=>j.status==='scheduled'))return 'scheduled';
 if(jobs.some(j=>j.status==='upload_failed'))return 'failed';
 return null;
}
function reconcileServerJobs(){
 for(const p of state.posts){
  const status=postTrackingState(p);
  if(status==='published')p.status='published';
  else if(status==='partial')p.status='attention';
  else if(status==='verification')p.status='awaiting_verification';
  else if(status==='failed')p.status='attention';
  else if(status==='processing')p.status='processing';
  else if(status==='uploading')p.status='uploading';
  else if(status==='scheduled')p.status='scheduled';
 }
}

function publishingHealth(){
 const active=activeWorkspace();
 const jobs=(state.wpServerJobs||[]).filter(j=>!active||(j.platform==='instagram'&&String(j.external_id)===String(active.external_id)));
 const now=Math.floor(Date.now()/1000);
 return {jobs,verified:jobs.filter(j=>j.status==='published'&&j.verification_status==='verified'),
 pending:jobs.filter(j=>j.status==='awaiting_verification'||(j.status==='published'&&j.verification_status!=='verified')),
 failed:jobs.filter(j=>['failed','error','attention'].includes(j.status)),
 overdue:jobs.filter(j=>['scheduled','processing'].includes(j.status)&&Number(j.scheduled_at)>0&&Number(j.scheduled_at)<now-900)};
}

}

function prepareFestivalDrafts(){
 const account=activeWorkspace();if(!account)return toast('Select an Instagram account before preparing festivals');
 const today=dateLocal(),until=addDays(today,30);
 const events=(state.events||[]).filter(e=>e.type==='festival'&&e.date>=today&&e.date<=until);
 let created=0;
 for(const event of events){
  const ref='festival:'+event.id+':'+accountKey(account);
  if(state.posts.some(p=>p.autoPrepRef===ref))continue;
  state.posts.push({id:uid(),title:event.title,caption:makeCaption(event.title,'festival'),date:event.date,time:state.settings.time||'09:00',kind:'image',status:'draft',targets:['ig_story'],workspaces:[accountKey(account)],autoPrepRef:ref,thumb:'',mediaId:null,origin:'festival-draft'});
  created++;
 }
 if(created){save();route('queue')}
 toast(created?created+' festival drafts prepared. Add posters before scheduling.':'No new festival drafts needed in the next 30 days.');
}

 const name=window.prompt('Template name',title?title+' caption':'New caption template');

 state.captionTemplates=state.captionTemplates||[];

 if(state.captionTemplates.some(t=>t.workspace===workspace&&t.title.toLowerCase()===clean.toLowerCase()))return toast('A template with this name exists in this account.');
 state.captionTemplates.push({id:uid(),title:clean,text,workspace});

function bulkScheduleSelected(){
 const account=activeWorkspace();if(!account)return toast('Select an Instagram workspace before bulk publishing.');
 if(!hasWordPressPair())return toast('Connect WordPress first.');
 const chosen=workspacePosts(state.posts).filter(p=>bulkSelected.has(p.id));
 if(!chosen.length)return toast('Select posts first.');
 if(chosen.length>100)return toast('Bulk limit is 100 posts per batch.');
 const jobs=[],errors=[],batchKeys=new Set();
 for(const p of chosen){
  if(hasActiveServerJobs(p.id)){errors.push(p.title+': existing server job');continue;}
  if(!p.mediaId&&!p.mediaIds?.length){errors.push(p.title+': no media');continue;}
  const check=validScheduleIST(p.date,p.time);if(!check.ok){errors.push(p.title+': '+check.message);continue;}
  const targets=wordpressTargetsForImported(p).filter(t=>accountKey(t.a)===accountKey(account));
  if(!targets.length){errors.push(p.title+': no Instagram destination');continue;}
  const key=p.date+'|'+p.time+'|'+(p.fingerprint||p.mediaId||p.id);if(batchKeys.has(key)){errors.push(p.title+': duplicate media and schedule within batch');continue;}batchKeys.add(key);
  jobs.push({post:p,targets});
 }
 if(errors.length){showModal({title:'Bulk Schedule · Fix Errors',body:'<p class="sub">No jobs submitted. Resolve all errors first.</p>'+errors.slice(0,35).map(x=>'<div class="detail-error">'+esc(x)+'</div>').join('')});return;}
 const count=jobs.reduce((n,x)=>n+x.targets.length,0);
 if(!confirm('Upload '+count+' publishing jobs for '+jobs.length+' posts to '+account.name+'?'))return;
 for(const item of jobs)submitDirectWordPress(item.post,item.targets);
 save();bulkSelected.clear();bulkMode=false;render();toast('Uploads requested. Check Publishing Health for server results.');
}

function seedIndianDays(){
 let list=[['New Year','01-01'],['National Youth Day','01-12'],['Republic Day','01-26'],['Shaheed Diwas (Bhagat Singh)','03-23'],['Ambedkar Jayanti','04-14'],['Labour Day','05-01'],['World Environment Day','06-05'],['Independence Day','08-15'],['Teachers Day','09-05'],['Gandhi Jayanti','10-02'],['Children Day','11-14'],['Constitution Day','11-26'],['Christmas','12-25']];
 let year=dateLocal().slice(0,4),count=0;
 list.forEach(([title,monthDay])=>{if(!state.events.some(e=>e.title===title&&e.date.endsWith(monthDay))){state.events.push({id:uid(),title,date:year+'-'+monthDay,type:'festival',repeat:true,private:false});count++}});
 save();route('events');toast(`${count} recurring fixed-date occasions added. Movable festivals need yearly verification.`)
}

function mediaPreflightMessage(m){
 if(!m)return 'No image or video ready.';
 const details=[(m.size/1048576).toFixed(1)+' MB',m.type.replace('image/','').replace('video/','').toUpperCase()];
 if(m.width&&m.height){
  details.unshift(m.width+' × '+m.height+' px');
  const r=m.width/m.height;
  if(m.width<320||m.height<320)details.push('⚠ Resolution too low for reliable Instagram publishing');
  else if(Math.abs(r-9/16)<.04||Math.abs(r-1)<.04||Math.abs(r-4/5)<.04)details.push('✓ Standard social aspect');
  else details.push('⚠ Nonstandard aspect — review crop');
 }
 if(Number.isFinite(m.duration)&&m.duration>0)details.push(Math.round(m.duration)+' sec');
 return details.join(' · ');
}
function previewSelectedPostMedia(){

 const version=selectedMediaVersion;
 const label=document.getElementById('mediaQualityInfo');
 if(label)label.textContent='Inspecting and saving temporary media snapshot…';
 selectedMediaPromise=(async()=>{
  if(file.size<=0)throw Error('Media file is empty.');
  if(file.size>100*1024*1024)throw Error('Media exceeds 100 MB import limit');
  if(!/^(image\/(jpeg|png|webp)|video\/(mp4|quicktime))$/i.test(file.type))throw Error('Unsupported format. Choose JPG, PNG, WebP or MP4.');
  // Read the Android gallery selection once, before transient URI access can expire.
  const bytes=await file.arrayBuffer();
  if(version!==selectedMediaVersion)return null;
  const captured={bytes,name:file.name,type:file.type,size:file.size,width:0,height:0,duration:0};
  selectedMediaSnapshot=captured;
  selectedMediaPreviewUrl=URL.createObjectURL(new Blob([bytes],{type:file.type}));
  if(label)label.textContent=mediaPreflightMessage(captured);
  if(file.type.startsWith('image/')){
   const img=new Image();
   img.onload=()=>{if(version!==selectedMediaVersion)return;captured.width=img.naturalWidth;captured.height=img.naturalHeight;if(label)label.textContent=mediaPreflightMessage(captured);};
   img.onerror=()=>{if(version===selectedMediaVersion&&label)label.textContent=mediaPreflightMessage(captured)+' · Could not inspect image dimensions';};
   img.src=selectedMediaPreviewUrl;
   if(preview){preview.src=selectedMediaPreviewUrl;preview.style.display='block';}
  }else{
   if(preview){preview.removeAttribute('src');preview.style.display='none';}
   const v=document.createElement('video');v.preload='metadata';v.muted=true;
   v.onloadedmetadata=()=>{if(version!==selectedMediaVersion)return;captured.width=v.videoWidth;captured.height=v.videoHeight;captured.duration=Number.isFinite(v.duration)?v.duration:0;if(label)label.textContent=mediaPreflightMessage(captured);v.removeAttribute('src');v.load();};

   v.src=selectedMediaPreviewUrl;
  }
  return captured;
 })().catch(err=>{if(version===selectedMediaVersion){if(label)label.textContent='Media error: '+(err.message||err);toast('Cannot access media. Re-select from Files or Downloads.')}return null});
}

function posterBindTouch(){const canvas=document.getElementById('posterCanvas');if(!canvas)return;canvas.style.touchAction='none';const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};canvas.onpointerdown=e=>{const p=point(e);let closest=-1,dist=.12;posterLayers.forEach((l,i)=>{const d=Math.hypot(l.x-p.x,l.y-p.y);if(d<dist){dist=d;closest=i}});posterSelected=closest;if(closest>=0){posterDrag={dx:p.x-posterLayers[closest].x,dy:p.y-posterLayers[closest].y};canvas.setPointerCapture(e.pointerId)}posterLoadSelectedControls();posterPaint()};canvas.onpointermove=e=>{if(!posterDrag||posterSelected<0)return;const p=point(e),l=posterLayers[posterSelected];l.x=Math.max(0,Math.min(1,p.x-posterDrag.dx));l.y=Math.max(0,Math.min(1,p.y-posterDrag.dy));posterPaint()};canvas.onpointerup=()=>posterDrag=null;canvas.onpointercancel=()=>posterDrag=null}
function posterLoadSelectedControls(){const l=posterLayers[posterSelected];if(!l)return;const values={posterText:l.text,posterTextColor:l.color,posterFont:l.font,posterFontSize:l.size,posterOpacity:l.opacity,posterTextAngle:l.angle};Object.entries(values).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v})}
function posterUpdateSelected(){const l=posterLayers[posterSelected];if(!l)return;const get=id=>document.getElementById(id)?.value;l.text=get('posterText')||'';l.color=get('posterTextColor');l.font=get('posterFont');l.size=Number(get('posterFontSize'));l.opacity=Number(get('posterOpacity'));l.angle=Number(get('posterTextAngle'));posterPaint()}

function posterPreviewFilters(){const out=document.getElementById('posterCanvas'),c=posterWork;if(!out)return;const b=Number(document.getElementById('posterBright').value),k=Number(document.getElementById('posterContrast').value),s=Number(document.getElementById('posterSat').value),ctx=out.getContext('2d');ctx.clearRect(0,0,out.width,out.height);ctx.filter='brightness('+b+'%) contrast('+k+'%) saturate('+s+'%)';ctx.drawImage(c,0,0);ctx.filter='none'}
function posterApplyFilters(){const b=Number(document.getElementById('posterBright').value),k=Number(document.getElementById('posterContrast').value),s=Number(document.getElementById('posterSat').value);if(b===100&&k===100&&s===100)return;posterPushUndo();const c=posterWork,n=document.createElement('canvas');n.width=c.width;n.height=c.height;const ctx=n.getContext('2d');ctx.filter='brightness('+b+'%) contrast('+k+'%) saturate('+s+'%)';ctx.drawImage(c,0,0);window.posterWork=n;showPosterCanvas()}
function posterUndo(){const data=posterHistory.pop();if(!data){toast('Nothing to undo');return}const im=new Image();im.onload=()=>{const n=document.createElement('canvas');n.width=im.width;n.height=im.height;n.getContext('2d').drawImage(im,0,0);window.posterWork=n;showPosterCanvas()};im.src=data}
function posterAddText(){const t=document.getElementById('posterText').value.trim();if(!t){toast('Enter text first');return}const layer={text:t,x:.5,y:.8,size:Number(document.getElementById('posterFontSize').value),color:document.getElementById('posterTextColor').value,font:document.getElementById('posterFont').value,opacity:Number(document.getElementById('posterOpacity').value),angle:Number(document.getElementById('posterTextAngle').value)};posterLayers.push(layer);posterSelected=posterLayers.length-1;posterPaint();toast('Drag text to position it')}
function posterRotate(){posterPushUndo();const c=posterWork,n=document.createElement('canvas');n.width=c.height;n.height=c.width;const ctx=n.getContext('2d');ctx.translate(n.width,0);ctx.rotate(Math.PI/2);ctx.drawImage(c,0,0);window.posterWork=n;showPosterCanvas()}
function posterFlip(){posterPushUndo();const c=posterWork,n=document.createElement('canvas');n.width=c.width;n.height=c.height;const ctx=n.getContext('2d');ctx.translate(n.width,0);ctx.scale(-1,1);ctx.drawImage(c,0,0);window.posterWork=n;showPosterCanvas()}
function posterCrop(ratio){posterPushUndo();const c=posterWork,n=document.createElement('canvas');let w=c.width,h=c.height;if(w/h>ratio)w=Math.round(h*ratio);else h=Math.round(w/ratio);n.width=w;n.height=h;n.getContext('2d').drawImage(c,Math.round((c.width-w)/2),Math.round((c.height-h)/2),w,h,0,0,w,h);window.posterWork=n;showPosterCanvas()}
function posterLoadLogo(){const f=document.getElementById('posterLogo')?.files?.[0];if(!f||!f.type.startsWith('image/'))return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);posterLogoImage=im;toast('Logo loaded. Tap Apply Logo.')};im.onerror=()=>{URL.revokeObjectURL(url);toast('Invalid logo')};im.src=url}
function posterApplyLogo(){if(!posterLogoImage){toast('Choose logo first');return}posterPushUndo();const c=posterWork,ctx=c.getContext('2d'),w=Number(document.getElementById('posterLogoSize').value)/100*c.width,h=w*posterLogoImage.height/posterLogoImage.width,pos=document.getElementById('posterLogoPos').value,pad=c.width*.04;const x=pos.endsWith('r')?c.width-w-pad:pad,y=pos.startsWith('t')?pad:c.height-h-pad;ctx.drawImage(posterLogoImage,x,y,w,h);showPosterCanvas()}

function posterSaveCopy(){const merged=document.createElement('canvas');merged.width=posterWork.width;merged.height=posterWork.height;const ctx=merged.getContext('2d');ctx.drawImage(posterWork,0,0);const sel=posterSelected;posterSelected=-1;posterDrawLayers(ctx);posterSelected=sel;posterPendingLayers=JSON.parse(JSON.stringify(posterLayers));merged.toBlob(blob=>{if(!blob){toast('Image export failed');return}editedPosterFile=new File([blob],'postflow-edited-'+Date.now()+'.jpg',{type:'image/jpeg'});const data=merged.toDataURL('image/jpeg',.85);closeModal();editPost(editing);posterRestoreForm(posterDraftFields);posterDraftFields=null;const preview=document.getElementById('postLargePreview');if(preview){preview.src=data;preview.style.display='block'}toast('Edited copy ready. Tap Save Post to attach it.')},'image/jpeg',.9)}
async function storePost(scheduleNow=false){
  syncReviewSchedule();
  if(postSubmitBusy)return toast('Scheduling request is already in progress.');
  const selectedWP=scheduleNow?composerWordPressDestinations():[];
  if(scheduleNow&&activeWorkspace()&&selectedWP.some(({a})=>accountKey(a)!==state.activeWorkspace))return toast('Different account selected. Switch to All Accounts to schedule across profiles.');
  if(scheduleNow){
    if(!hasWordPressPair())return toast('WordPress not connected. Save as Draft first, then connect through Accounts.');
    if(!selectedWP.length)return toast('Select a connected Instagram/Facebook account and Feed or Story in Step 2.');
    const d=document.getElementById('pDate')?.value,t=document.getElementById('pTime')?.value;
    const check=validScheduleIST(d,t);
    if(!check.ok){const error=document.getElementById('reviewTimeError');if(error){error.style.display='block';error.textContent=check.message;}return toast(check.message);}
    if(!window.PostFlowNative?.queueWordPressPost)return toast('Android publishing support unavailable.');
    const chosenCarousel=pendingCarouselFiles.length>1||(pendingCarouselFiles.length===0&&document.getElementById('pKind')?.value==='carousel');
    if(selectedWP.some(x=>x.placement==='carousel')&&!chosenCarousel&&!((editing&&state.posts.find(x=>x.id===editing)?.mediaIds?.length>1)))return toast('Choose 2–10 carousel photos before selecting Carousel Feed.');
    if(chosenCarousel&&selectedWP.some(x=>x.placement==='story'))return toast('Carousel cannot be published as a Story. Select Feed or use one image.');
  }

  if(scheduleNow)setScheduleBusy(true);
  try{
  const selectedIds=[...document.querySelectorAll('#overlay input[data-wp-destination]')].filter(x=>x.checked).map(x=>x.dataset.platform+'_'+x.dataset.external+':'+x.dataset.placement);
  const title=document.getElementById('pTitle').value.trim(),date=document.getElementById('pDate').value,time=document.getElementById('pTime').value,status=document.getElementById('pStatus').value;
  const targets=DEST.map(x=>x[0]).filter(k=>document.getElementById('tar_'+k).checked);
  if(!title||!date||!time){toast('Title, date and time required');return}
  if(editing&&hasActiveServerJobs(editing)){toast('Server job already submitted. Editing here will not update WordPress, so edit is blocked.');return}
  if(!scheduleNow&&status==='scheduled'&&!targets.length){toast('Select destinations or save as Draft');return}
  let old=state.posts.find(x=>x.id===editing)||{},id=editing||uid();
  let accountTargets={};state.accounts.forEach(a=>{let destinations=placementsForAccount(a).map(x=>x[0]).filter(k=>document.getElementById('account_'+a.id+'_'+k)?.checked);if(destinations.length)accountTargets[a.id]=destinations});
  let post={...old,id,title,date,time,status:scheduleNow?'uploading': 'draft',targets,accountTargets,wpSelected:selectedIds,workspaces:[...new Set(selectedWP.map(({a})=>accountKey(a)).concat(activeWorkspace()?[state.activeWorkspace]:[]))],captionApproved:true,ratio:document.getElementById('pRatio')?.value||'original',fitMode:document.getElementById('pFit')?.value||'contain',caption:document.getElementById('pCaption').value,kind:document.getElementById('pKind').value};if(editedPosterFile&&posterPendingLayers){post.posterLayers=posterPendingLayers;post.sourceMediaId=old.sourceMediaId||old.mediaId||null;}
  const carouselFiles=[...pendingCarouselFiles];
  if(carouselFiles.length){
    if(carouselFiles.length>10||carouselFiles.some(f=>!['image/jpeg','image/png'].includes(f.type))){toast('Select up to 10 JPG/PNG images');return}
    if(carouselFiles.length===1){const single=carouselFiles[0];pendingCarouselFiles=[];const input=document.getElementById('pMedia');try{const dt=new DataTransfer();dt.items.add(single);input.files=dt.files;}catch(e){editedPosterFile=single;}}
    else {
    let ids=[],firstBytes=null;
    const selectedRatio=document.getElementById('pRatio')?.value||'original';
    const targetRatio=(selectedRatio==='1:1'||selectedRatio==='4:5')?selectedRatio:'4:5';
    const fitMode=document.getElementById('pFit')?.value||'contain';
    try{
      for(let n=0;n<carouselFiles.length;n++){
        const converted=await normalizeCarouselImage(carouselFiles[n],targetRatio,fitMode);
        const id=uid().replace(/[^a-zA-Z0-9_-]/g,'');
        const bytes=new Uint8Array(await converted.arrayBuffer());
        if(!await persistMedia(id,'carousel_'+(n+1)+'.jpg',bytes))throw Error('Cannot save carousel image '+(n+1));
        if(!firstBytes)firstBytes=bytes;
        ids.push(id);
      }
    }catch(e){ids.forEach(cleanupMedia);toast('Carousel preparation failed: '+(e.message||'Invalid image'));return}
    post.mediaIds=ids;post.mediaId=ids[0];post.mediaName=ids.length+' prepared JPEG images';
    post.kind='carousel';post.ratio=targetRatio;post.fitMode=fitMode;
    post.thumb=await thumbnail(firstBytes,'image/jpeg');
    }
  }
  let file=carouselFiles.length>1?null:(editedPosterFile||document.getElementById('pMedia').files[0]);
  if(!editedPosterFile&&file&&selectedMediaPromise){const captured=await selectedMediaPromise;if(!captured)throw Error('Gallery file access expired. Re-select media from Files / Downloads.');if(captured.width&&captured.height&&(captured.width<320||captured.height<320))throw Error('Selected media is too low resolution (minimum 320 px each dimension).');}
  if(post.kind==='carousel'&&(!post.mediaIds||post.mediaIds.length<2)){toast('Attach 2–10 carousel images');return}
  if(post.kind!=='carousel'&&carouselFiles.length<2)post.mediaIds=[];
  if(file){
    if(file.size>100*1024*1024){toast('Single file limit: 100 MB');return}
    const bytes=new Uint8Array(!editedPosterFile&&selectedMediaSnapshot?.name===file.name&&selectedMediaSnapshot?.size===file.size?selectedMediaSnapshot.bytes:await file.arrayBuffer());
    const mediaId=uid().replace(/[^a-zA-Z0-9_-]/g,'');
    if(!await persistMedia(mediaId,file.name,bytes)){toast('Media could not be saved; post not updated');return}
    post.mediaId=mediaId;post.mediaName=file.name;
    post.thumb=file.type.startsWith('image/')?await thumbnail(bytes,file.type):'';
    post.kind=file.type.startsWith('video/')?'reel':'image';
  }
  if(editing)state.posts=state.posts.map(x=>x.id===editing?post:x);else state.posts.push(post);
  if(!save()){if(!editing)state.posts.pop();return}
  (old.mediaIds?.length?old.mediaIds:[old.mediaId]).filter(Boolean).forEach(id=>{if(!(post.mediaIds||[]).includes(id)&&post.mediaId!==id&&post.sourceMediaId!==id&&!state.posts.some(x=>x.id!==post.id&&(x.mediaId===id||(x.mediaIds||[]).includes(id)||x.sourceMediaId===id)))cleanupMedia(id)});
  editedPosterFile=null;clearSelectedMediaSnapshot();posterPendingLayers=null;pendingCarouselFiles=[];carouselPreviewUrls.forEach(URL.revokeObjectURL);carouselPreviewUrls=[];closeModal();route('queue');
  if(scheduleNow){submitDirectWordPress(post,selectedWP);toast('Uploading to WordPress. Check Publishing Center for confirmation.');}else toast('Draft saved locally.');
  }catch(e){console.error('Post scheduling error',e);toast('Scheduling error: '+String(e.message||e).slice(0,110));}finally{if(scheduleNow)setScheduleBusy(false)}
}
function setBulkMode(on){bulkMode=on;bulkSelected.clear();render()}

function bulkSelectAll(){const ids=workspacePosts(state.posts).map(p=>p.id);if(bulkSelected.size===ids.length)bulkSelected.clear();else ids.forEach(id=>bulkSelected.add(id));render()}
function bulkChangeStatus(status){if(!bulkSelected.size){toast('Select posts first');return}let count=0;state.posts.forEach(p=>{if(bulkSelected.has(p.id)){p.status=status;count++}});save();render();toast(count+' posts updated')}
function bulkDelete(){if(!bulkSelected.size){toast('Select posts first');return}if(!confirm('Move '+bulkSelected.size+' selected posts to Recycle Bin?'))return;let removed=state.posts.filter(p=>bulkSelected.has(p.id));state.trash=state.trash||[];state.trash.unshift(...removed.map(p=>({...p,deletedAt:new Date().toISOString()})));state.posts=state.posts.filter(p=>!bulkSelected.has(p.id));save();bulkSelected.clear();render();toast(removed.length+' posts moved to Recycle Bin')}
function bulkEdit(){if(!bulkSelected.size){toast('Select posts first');return}showModal({title:'Bulk Edit · '+bulkSelected.size+' Posts',body:`<p class="sub">Only filled fields will be applied to selected posts. Leave blank to keep original content.</p><div class="field"><label>Caption prefix (brand name / phone / logo text)</label><textarea id="bulkPrefix" placeholder="GraphicaNest • Call 9876543210"></textarea></div><div class="field"><label>Caption suffix / hashtags</label><textarea id="bulkSuffix" placeholder="#Brand #Festival"></textarea></div><div class="field"><label>Replace caption entirely (optional)</label><textarea id="bulkCaption" placeholder="New caption for all selected posts"></textarea></div><div class="field"><label>Date (optional)</label><input type="date" id="bulkDate"></div><div class="field"><label>Time (optional)</label><input type="time" id="bulkTime"></div><div class="field"><label>Status (optional)</label><select id="bulkStatus"><option value="">Keep existing</option><option value="draft">Draft</option><option value="paused">Paused</option><option value="scheduled">Scheduled</option></select></div><div class="note">This updates captions and scheduling metadata, not pixels inside the image. To add a graphical logo or phone number on the poster itself, use the individual media editor after image editing is implemented.</div>${btn('Apply to selected','applyBulkEdit()','full')}`})}
function applyBulkEdit(){const pre=document.getElementById('bulkPrefix').value.trim(),suf=document.getElementById('bulkSuffix').value.trim(),replacement=document.getElementById('bulkCaption').value.trim(),date=document.getElementById('bulkDate').value,time=document.getElementById('bulkTime').value,status=document.getElementById('bulkStatus').value;let n=0;state.posts.forEach(p=>{if(!bulkSelected.has(p.id))return;let caption=replacement||p.caption||'';if(pre)caption=pre+'\\n'+caption;if(suf)caption=caption+'\\n'+suf;p.caption=caption;if(date)p.date=date;if(time)p.time=time;if(status)p.status=status;n++});save();closeModal();render();toast(n+' posts edited')}

function deletePost(id){if(!confirm('Move this post to Recycle Bin?'))return;let old=state.posts.find(x=>x.id===id);if(!old)return;state.trash=state.trash||[];state.trash.unshift({...old,deletedAt:new Date().toISOString()});state.posts=state.posts.filter(x=>x.id!==id);save();closeModal();render();toast('Moved to Recycle Bin.');}
async function whatsApp(id){
  let p=state.posts.find(x=>x.id===id);if(!p)return;
  let message=p.caption||p.title;
  if(p.mediaId&&window.PostFlowNative?.hasMedia(p.mediaId)){PostFlowNative.shareMedia(p.mediaId,message);return}
  if(p.mediaId && !window.PostFlowNative){
     let data=await retrieveWebMedia(p.mediaId);
     if(data&&navigator.canShare&&navigator.canShare({files:[new File([data],p.mediaName||'poster.jpg',{type:data.type||'image/jpeg'})]})){
       try{await navigator.share({files:[new File([data],p.mediaName||'poster.jpg',{type:data.type||'image/jpeg'})],text:message});return}catch(e){}
     }
  }
  if(window.PostFlowNative?.shareText)PostFlowNative.shareText(message);

   if(!current.filename){warnings.push('TXT [POST] without filename skipped');current=null;return;}
   if(seen.has(current.filename))warnings.push('Duplicate [POST] filename: '+current.filename);
   seen.add(current.filename);records.push(current);current=null;lastField=null;
 };

   if(/^\s*\[POST\]\s*$/i.test(line)){close();current={};lastField=null;continue;}
   if(/^\s*\[\/POST\]\s*$/i.test(line)){close();continue;}

   if(field){lastField=field[1].toLowerCase();current[lastField]=field[2].trim();}
   else if((lastField==='caption'||lastField==='greeting'))current[lastField]+='\n'+line;

}

function parseManifestDate(value){if(!value)return '';let d=guessDate(value);return d||(/^\d{4}-\d{2}-\d{2}$/.test(value)?value:'')}
async function findZipMetadataTxt(zip){
 const textFiles=Object.values(zip.files).filter(e=>!e.dir&&/\.txt$/i.test(e.name)&&!e.name.startsWith('__MACOSX/'));
 if(textFiles.length>15)throw Error('Too many TXT files in ZIP');
 const usable=[];
 for(const item of textFiles){
  if((item._data?.uncompressedSize||0)>1024*1024)continue;
  const raw=await item.async('text');
  if(/^\s*\[POST\]\s*$/im.test(raw))usable.push({name:item.name,raw,structured:true});
  else if(/(^|\/)captions\.txt$/i.test(item.name))usable.push({name:item.name,raw,structured:false});
 }
 if(usable.filter(x=>x.structured).length>1)throw Error('Multiple festival [POST] TXT files. Keep only one.');
 return usable.find(x=>x.structured)||usable[0]||null;
}

  const entries=Object.values(zip.files).filter(e=>!e.dir&&/\.(png|jpe?g|webp|mp4|mov)$/i.test(e.name)&&!e.name.startsWith('__MACOSX/'));
  if(!entries.length||entries.length>250)throw Error('Expected 1–250 media files');
  const txt=await findZipMetadataTxt(zip);
  const csv=Object.values(zip.files).find(e=>!e.dir&&/(^|\/)manifest\.csv$/i.test(e.name));
  const manifest=csv?csvRows(await csv.async('text')):{};
  const raw=txt?.raw||'';
  const structured=/^\s*\[POST\]\s*$/im.test(raw)?parseFestivalPostTxt(raw):null;
  const legacy=txt&&!structured?zipCaptionTextMap(raw):null;
  const counts=new Map();
  entries.forEach(e=>counts.set(safeFileName(e.name),(counts.get(safeFileName(e.name))||0)+1));
  const rows=entries.map(e=>{
    const meta=manifest[e.name]||manifest[safeFileName(e.name)]||{};

    if(structured?.duplicates.has(r?.filename))problems.push('Duplicate filename in TXT');

  });

function publishingHistory(id){const items=Object.values(state.wpPendingJobs||{}).filter(x=>x.postId===id);return items.length?'<div class="card"><h3>Publishing History</h3>'+items.map(j=>'<div class="item"><div class="body"><b>'+esc(j.account)+' · '+esc(j.placement)+'</b><small>Status: '+esc(j.status)+'</small><small>Scheduled: '+publishTime(j.scheduled_at)+'</small><small>Published: '+publishTime(j.published_at,j.status)+'</small>'+(j.error?'<small>Error: '+esc(j.error)+'</small>':'')+'</div></div>').join('')+'</div>':''}

function issueHelp(j){
 const raw=String(j.error||j.last_error||'');
 const lower=raw.toLowerCase(),code=String(j.error_code||'');
 if(!raw&&j.status!=='published'&&j.status!=='scheduled')return {cause:'Server has not supplied an error detail yet.',fix:'Refresh the job and check WordPress server logs if the status remains unchanged.'};
 if(/token|oauth|expired|190|access.*invalid/.test(lower))return {cause:'Account authorization may have expired or been revoked.',fix:'Reconnect this account through WordPress PostFlow Connect, then verify the current server job before retrying.'};
 if(/permission|scope|(#200)|(#10)|not authorized/.test(lower))return {cause:'The account does not appear to have the required publishing permission.',fix:'Check Meta App permissions and the connected Page/Instagram role; reconnect the account afterward.'};
 if(/format|aspect|resolution|image|media|video|codec|unsupported|400/.test(lower))return {cause:'The selected media may not meet the platform publishing requirements.',fix:'Review image/video format, size and aspect ratio; create a corrected job only after checking whether the original was published.'};
 if(/rate limit|429|quota|too many/.test(lower))return {cause:'The platform is limiting publishing requests.',fix:'Wait and retry only after the server confirms the previous attempt failed.'};
 if(/cron|schedule|timeout|network|connection|500|502|503/.test(lower))return {cause:'The server scheduler or API connection may be unavailable.',fix:'Check WordPress scheduled tasks and hosting logs. Do not resubmit until you confirm this job did not publish.'};
 return {cause:raw?'The server or platform rejected this publishing attempt.':'The publishing status is pending confirmation.',fix:'Review the technical error below and check the account on the platform before retrying.'};
}
function jobOverdue(j){
 const next=Number(j.next_attempt_at||j.scheduled_at||0),start=Number(j.processing_started_at||j.attempted_at||0),now=Math.floor(Date.now()/1000);
 return (j.status==='scheduled'&&next&&next<now-300)||(j.status==='processing'&&start&&start<now-600);
}
function jobDisplayStatus(j){if(j.status==='awaiting_verification')return 'Verification Pending';if(j.status==='published'&&j.verification_status!=='verified')return 'Verification Pending (legacy record)';if(jobOverdue(j))return 'delayed · investigate';if(j.status==='published')return 'Verified Published';return String(j.status||'unknown')}
function jobStatusClass(j){return jobOverdue(j)||['failed','attention','error','upload_failed'].includes(j.status)?'red':j.status==='published'&&j.verification_status==='verified'?'green':''}
function jobErrorPanel(j){
 const e=String(j.error||j.last_error||'').slice(0,1200);
 if(jobOverdue(j))return '<div class="detail-error"><strong>Publishing delayed</strong><p>This job is past its due time or processing has stalled. Check WordPress cron and Instagram before retrying; duplicate posts may result.</p><p>Scheduled: '+publishTime(j.scheduled_at)+' · Next attempt: '+publishTime(j.next_attempt_at)+' · Attempts: '+Number(j.attempts||0)+'</p></div>';
 if(['awaiting_verification','published'].includes(j.status)&&j.verification_status!=='verified')return '<div class="note"><strong>Publication verification pending</strong><p>WordPress has not independently confirmed this platform post. Do not publish it again until checked on Instagram/Facebook.</p></div>';
 if(!['failed','attention','error','upload_failed'].includes(j.status)&&!e)return '';
 const guide=issueHelp(j);
 return '<div class="detail-error"><strong>Why was this post not published?</strong><p>'+esc(guide.cause)+'</p><p><b>What to do:</b> '+esc(guide.fix)+'</p><div class="line"></div><small>Platform / server error: '+esc(e||'No detailed error was provided by the server.')+'</small><small> · Code: '+esc(j.error_code||'Not provided')+'</small></div>';
}
function showPublishJobs(){
 const jobs=(state.wpServerJobs||[]).filter(j=>!activeWorkspace()||(j.platform==='instagram'&&String(j.external_id)===String(activeWorkspace().external_id))).map(j=>'<div class="item" onclick="showJobDetail('+Number(j.id)+')"><div class="body"><b>'+esc(j.account_name||j.external_id||j.platform)+' · '+esc(j.placement)+'</b><span class="tag '+jobStatusClass(j)+'">'+esc(jobDisplayStatus(j))+'</span><small>Scheduled: '+publishTime(j.scheduled_at)+'</small><small>Published: '+publishTime(j.published_at,j.status)+'</small>'+(j.error?'<small>Issue: '+esc(String(j.error).slice(0,110))+'</small>':'')+'</div><span class="rowbtn">Details ›</span></div>').join('');
 showModal({title:'Publishing Center',body:'<p class="sub">Live server results. Publishing and local reminders are separate.</p>'+(jobs||'<div class="empty">No server jobs yet</div>')+btn('Refresh','closeModal();refreshPublishJobs()','full')});
}
function dateTimeLocalIST(unix){if(!unix)return '';const d=new Date((unix+19800)*1000);return d.toISOString().slice(0,16)}
function openJobEdit(id){
 const j=(state.wpServerJobs||[]).find(x=>Number(x.id)===id);if(!j||j.status!=='scheduled')return toast('Only pending scheduled jobs can be edited');
 const accounts=(state.wpAccounts||[]).filter(a=>a.platform===j.platform);
 const options=accounts.map(a=>'<option value="'+esc(a.external_id)+'" '+(String(a.external_id)===String(j.external_id)?'selected':'')+'>'+esc(a.name)+'</option>').join('');
 const placements=j.media_count>1?['carousel']:(j.platform==='instagram'?['feed','story','reel']:['feed','story','reel']);
 const picks=placements.map(p=>'<option value="'+p+'" '+(j.placement===p?'selected':'')+'>'+({feed:'Feed post',story:'Story',reel:'Reel',carousel:'Carousel'}[p])+'</option>').join('');
 showModal({title:'Edit Scheduled Post',body:'<div class="note">Changes are sent to WordPress. The server will reject edits after publishing starts. Original media stays unchanged.</div><div class="field"><label>Publishing destination</label><select id="jobPlacement">'+picks+'</select></div><div class="field"><label>Account</label><select id="jobAccount">'+options+'</select></div><div class="field"><label>Caption</label><textarea id="jobCaption">'+esc(j.caption||'')+'</textarea></div><div class="field"><label>Scheduled Date & Time (IST)</label><input id="jobTime" type="datetime-local" value="'+dateTimeLocalIST(j.scheduled_at)+'"></div>'+btn('Save on WordPress','submitJobEdit('+id+')','full')+btn('Back','showJobDetail('+id+')','secondary full')});
}
function submitJobEdit(id){
 const j=(state.wpServerJobs||[]).find(x=>Number(x.id)===id);if(!j||j.status!=='scheduled')return toast('This job is no longer editable');
 const placement=document.getElementById('jobPlacement')?.value||'',account=document.getElementById('jobAccount')?.value||'',caption=document.getElementById('jobCaption')?.value||'',raw=document.getElementById('jobTime')?.value||'';
 const [date,time]=raw.split('T'),validation=validScheduleIST(date,time);
 if(!validation.ok)return toast(validation.message);
 const when=validation.when;
 if(!account)return toast('Select a connected account');
 if(!confirm('Update this scheduled WordPress job?'))return;
 if(!window.PostFlowNative?.editWordPressJob)return toast('Updated Android app required');
 PostFlowNative.editWordPressJob(id,placement,account,caption,when);closeModal();toast('Sending update to WordPress…');
}
function cancelServerJob(id){
 const j=(state.wpServerJobs||[]).find(x=>Number(x.id)===id);if(!j||j.status!=='scheduled')return toast('Only scheduled jobs can be cancelled');
 if(!confirm('Cancel this WordPress publishing job? It will not be published if cancellation succeeds.'))return;
 if(!window.PostFlowNative?.cancelWordPressJob)return toast('Updated Android app required');
 PostFlowNative.cancelWordPressJob(id);closeModal();toast('Requesting cancellation…');
}
function showJobDetail(id){
 const j=(state.wpServerJobs||[]).find(x=>Number(x.id)===id);if(!j)return;
 const actual=j.published_at?publishTime(j.published_at,j.status):publishTime(null,j.status);
 const attempted=j.attempted_at||null;
 const progress='<div class="card"><h3>Publishing Timeline</h3><p>① Scheduled · '+publishTime(j.scheduled_at)+'</p><p>② Attempted · '+publishTime(attempted)+'</p><p>③ '+(j.status==='published'&&j.verification_status==='verified'?'Verified Published':'Current status: '+esc(jobDisplayStatus(j)))+' · '+actual+'</p></div>';
 const actions=j.status==='scheduled'?'<div class="actions">'+btn('Edit Schedule','openJobEdit('+id+')')+btn('Cancel Schedule','cancelServerJob('+id+')','secondary')+'</div>':'';
 showModal({title:'Publishing Details',body:'<div class="card"><b>'+esc(j.platform)+' · '+esc(j.placement)+'</b><p>Status: <span class="tag '+jobStatusClass(j)+'">'+esc(jobDisplayStatus(j))+'</span></p><p>Scheduled Time: '+publishTime(j.scheduled_at)+'</p><p>Attempted Time: '+publishTime(attempted)+'</p><p>Actual Published Time: '+actual+'</p><p>Media count: '+Number(j.media_count||1)+'</p><p>Meta ID: '+esc(j.external_post_id||'Not available')+'</p></div>'+progress+jobErrorPanel(j)+actions+'<div class="note">Verify the live platform post before retrying. Completed jobs cannot be edited.</div>'+btn('Back to Jobs','showPublishJobs()','full')});
}

function hasWordPressPair(){try{return !!window.PostFlowNative?.isWordPressPaired?.()}catch(e){return false}}
let welcomePairDismissed=false;
function showWordPressWelcome(){
 if(welcomePairDismissed||hasWordPressPair()||document.getElementById('overlay')?.innerHTML)return;
 welcomePairDismissed=true;
 showModal({title:'Connect WordPress',body:'<div class="note"><b>Connect graphicanest.in</b><p>Connect PostFlow to WordPress to schedule Instagram and Facebook publishing. You can still create drafts and plan content offline.</p></div>'+btn('Connect Now','openWordPressPair()','full')+btn('Later','closeModal()','secondary full')});
}
function openWordPressPair(){if(!window.PostFlowNative?.pairWordPress){toast('Android native app update required');return}showModal({title:'Pair WordPress',body:`<div class="note">Website: https://graphicanest.in. Generate your private pairing key in WordPress Settings → PostFlow Connect. Never share it in chat.</div><div class="field"><label>Private Pairing Key</label><input id="wpPairKey" type="password" autocomplete="off" placeholder="Paste pairing key"></div>${btn('Save Key & Sync','saveWordPressPair()','full')}`})}
function saveWordPressPair(){const field=document.getElementById('wpPairKey');const key=field?.value.trim()||'';if(!/^[A-Za-z0-9_-]{32,128}$/.test(key)){toast('Invalid pairing key format');return}field.value='';closeModal();state.wpSyncStatus='Connecting…';render();window.PostFlowNative.pairWordPress(key)}
function syncWordPressAccounts(){if(!window.PostFlowNative?.syncWordPressAccounts){toast('Android native app update required');return}state.wpSyncStatus='Syncing…';render();window.PostFlowNative.syncWordPressAccounts()}
function unpairWordPress(){if(!confirm('Unpair WordPress and clear synced account list from this phone?'))return;if(window.PostFlowNative?.unpairWordPress)window.PostFlowNative.unpairWordPress();state.wpAccounts=[];state.wpSyncStatus='Unpaired';save();render()}
window.onWordPressSync=function(raw){try{const data=JSON.parse(raw);if(data.error){state.wpSyncStatus=data.error;toast(data.error)}else if(data.unpaired){state.wpAccounts=[];state.wpSyncStatus='Unpaired'}else if(Array.isArray(data.accounts)){state.wpAccounts=data.accounts.filter(a=>a.connected&&['facebook','instagram','google'].includes(a.platform)).map(a=>({name:String(a.name||''),username:String(a.username||a.name||''),platform:a.platform,external_id:String(a.external_id||''),expires:Number(a.token_expires_at||0),connection_status:String(a.connection_status||'connected')}));if(state.activeWorkspace&&!instagramWorkspaces().some(a=>accountKey(a)===state.activeWorkspace))state.activeWorkspace='';state.wpSyncStatus='Last sync: '+new Date().toLocaleString('en-IN')+' • '+state.wpAccounts.length+' verified';toast('Accounts synced: '+state.wpAccounts.length)}save();if(page==='accounts')render()}catch(e){toast('Invalid WordPress response')}};
function connectSocialAccount(){showModal({title:'Connect Social Account',body:`<div class="note">Official Instagram, Facebook Pages and Google Business Profile authorization needs a configured OAuth backend and approved platform permissions. This version does not pretend a label is a live connection.</div><div class="field"><label>Platform</label><select id="connectPlatform"><option>Instagram</option><option>Facebook Pages</option><option>Google Business Profile</option></select></div>${btn('Check Connection Setup','checkSocialSetup()','full')}${btn('Add Offline Label Instead','addAccount()','secondary full')}`})}
function checkSocialSetup(){const c=state.apiConfig||{};if(!c.backend||!c.backend.startsWith('https://')){toast('Set up HTTPS OAuth backend in API Configuration first');return}showModal({title:'Connection Not Ready',body:'<div class="note">The HTTPS backend address is saved, but this app does not yet have a working OAuth callback, token exchange, or account verification. No social account has been connected. Configure a supported OAuth service before attempting login.</div>'})}
function addAccount(){showModal({title:'Add Account Label',body:`<p class="sub">Planning label only. Social authorization is not included.</p><div class="field"><label>Platform</label><select id="aPlatform"><option>Instagram</option><option>Facebook Pages</option><option>Google Business Profile</option></select></div><div class="field"><label>Page / Profile Name</label><input id="aName" placeholder="My Business Page"></div>${btn('Add Label','saveAccount()','full')}`})}function saveAccount(){let name=document.getElementById('aName').value.trim();if(!name){toast('Name required');return}state.accounts.push({id:uid(),name,platform:document.getElementById('aPlatform').value});save();closeModal();render()}function deleteAccount(id){state.accounts=state.accounts.filter(a=>a.id!==id);save();render()}
function exportBackup(){if(!confirm('Export your local media, drafts and settings into a ZIP? The backup is NOT encrypted. Keep it private. WordPress pairing credentials are not transferred.'))return;if(window.PostFlowNative?.exportBackup)PostFlowNative.exportBackup();else exportJsonBackup()}
function importNativeBackup(){if(!confirm('Restore will replace local content. Back up your current posts first. Existing WordPress jobs are not automatically resubmitted.'))return;if(window.PostFlowNative?.importBackup)PostFlowNative.importBackup();else importBackup()}
function exportJsonBackup(){let blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='postflow-metadata-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Settings-only backup exported. Original media not included.')}
function importBackup(){showModal({title:'Restore JSON Backup',body:`<div class="note">Restoring replaces current posts/events. JSON file does NOT contain original media.</div><div class="field"><input type="file" id="backupFile" accept=".json,application/json"></div>${btn('Restore JSON','restoreBackup()','full')}`})}
async function restoreBackup(){let f=document.getElementById('backupFile').files[0];if(!f)return;if(!confirm('Replace all existing local data?'))return;try{let a=JSON.parse(await f.text());if(!a.state||!Array.isArray(a.state.posts)||!Array.isArray(a.state.events))throw Error('Invalid backup');state={...JSON.parse(JSON.stringify(defaultStore)),...a.state};save();closeModal();route('home');toast('Metadata restored')}catch(e){toast('Invalid backup file')}}
window.applyNativeRestoredState=function(json){try{let restored=JSON.parse(json);if(!Array.isArray(restored.posts)||!Array.isArray(restored.events))throw Error('Invalid data');state={...JSON.parse(JSON.stringify(defaultStore)),...restored};save();closeModal();route('home');toast('Posts, events and full media backup restored')}catch(e){toast('Restore display error')}};
render();setTimeout(()=>{if(hasWordPressPair())refreshPublishJobs(true)},3200);setInterval(()=>{if(hasWordPressPair()&&!document.hidden)refreshPublishJobs(true)},120000);if(window.PostFlowNative&&PostFlowNative.syncState){try{PostFlowNative.syncState(JSON.stringify(state))}catch(e){}}setTimeout(showWordPressWelcome,450);setTimeout(()=>{let upcoming=nextEvents().filter(e=>e.viewDate===dateLocal());if(upcoming.length&&state.settings.notifications)toast('Today: '+upcoming.map(e=>e.title).slice(0,2).join(', '));else notifyDue()},700);
</script></body></html>
