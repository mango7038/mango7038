/* V6 design system: accessible system/light/dark palette */
:root{--soft:#1c2440;--input:#171e33;--modal:#131b30;--navbg:#11182bd9;--fieldtext:#f5f7ff;--surface:#151b31;--stroke:#303957;--accent:#9779ff;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f6fa;--card:#ffffff;--line:#dfe4ee;--border:#d7ddeb;--text:#1d2537;--muted:#616d82;--soft:#eef0f9;--input:#fff;--modal:#fff;--navbg:#fffffff1;--fieldtext:#1d2537;--surface:#fff;--stroke:#d7ddeb;--primary:#674af0;--green:#17856f;--red:#ca455c;--accent:#644ce6}

header,nav{background:var(--navbg)!important;border-color:var(--line)!important}
.stat,.card,.sheet{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--line)!important;box-shadow:0 8px 28px #0c133015}
h1,h2,h3,b,label,.body{color:var(--text)}
.sheet{background:var(--modal)!important}
.item{border-color:var(--line)!important}
input,select,textarea{background:var(--input)!important;color:var(--fieldtext)!important;border:1px solid var(--line)!important}
.btn.secondary,.rowbtn{background:var(--soft)!important;color:var(--text)!important;border-color:var(--line)!important}
.note,.empty{background:var(--soft)!important;color:var(--muted)!important;border-color:var(--line)!important}
.tag{background:var(--soft);color:var(--primary)}
:root[data-theme="light"] .chip{background:#edeaff;color:#4d37be}
:root[data-theme="light"] .tag.green{background:#e0f8ee;color:#126b4d}
:root[data-theme="light"] .tag.red{background:#ffe5e9;color:#ad3146}
:root[data-theme="light"] .thumb{background:#edf0fa}
:root[data-theme="light"] .navItem{color:#67738a}
:root[data-theme="light"] .navItem.active{color:#563bd5}
:root[data-theme="light"] small,:root[data-theme="light"] .sub{color:var(--muted)}
.btn{transition:transform .18s ease,background .18s ease,opacity .18s ease}
.btn:active{transform:scale(.98)}
.card,.stat{border-radius:19px}
.wizard-head{padding:10px 0 14px}
.wizard-steps{display:flex;gap:7px;align-items:center;margin:12px 0}

.wizard-pip.active{background:var(--primary)}
.wizard-count{font-size:12px;font-weight:700;color:var(--muted)}
.wizard-actions{position:sticky;bottom:-2px;z-index:2;background:var(--modal);display:flex;gap:10px;padding:14px 0 5px;border-top:1px solid var(--line)}
.wizard-actions button{flex:1}
.composer-stage[hidden]{display:none!important}
.carousel-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}
.carousel-tile{position:relative;overflow:hidden;border-radius:12px;background:var(--soft);aspect-ratio:1;border:1px solid var(--line)}
.carousel-tile img{width:100%;height:100%;object-fit:cover}
.carousel-tile .tile-order{position:absolute;top:4px;left:4px;background:#24194dcc;color:white;border-radius:30px;padding:3px 7px;font-size:10px}
.carousel-tile .tile-controls{position:absolute;bottom:2px;right:2px;display:flex;gap:3px}
.carousel-tile button{border:0;border-radius:6px;background:#1c234ce8;color:#fff;padding:4px 6px;font-size:12px}
.detail-error{border:1px solid #da7582;border-radius:14px;padding:14px;background:color-mix(in srgb,var(--red) 9%,var(--card));margin:12px 0}
.detail-error strong{color:var(--red)}
.navItem{transition:background .18s ease}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

.hero-create{padding:22px!important;background:linear-gradient(115deg,var(--surface),var(--soft))!important;margin-bottom:16px}
.hero-create>b{font-size:19px}
.hero-create>.sub{margin:7px 0 17px}
.compact-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.compact-stats .stat{padding:12px 8px!important;text-align:center}
.compact-stats .stat b{font-size:27px;margin:7px 0 0}
.compact-stats .stat small{font-size:10px;line-height:1.2;display:block}
@media(max-width:365px){.compact-stats .stat b{font-size:23px}}
.advanced-settings{margin-top:18px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}.advanced-settings summary{cursor:pointer;font-weight:700;color:var(--text);padding:6px 0}.advanced-settings .section{margin-top:19px}</style></head><body>

id":"festival2026_21","title":"Guru Nanak Jayanti","date":"2026-11-24","type":"festival","repeat":false,"private":false,"source":"Official Maharashtra holiday 2026 / CAG restricted list"}];
const K='postflow_android_v3',defaultStore={posts:[],events:FESTIVALS_2026,imports:[],accounts:[],settings:{time:'09:00',notifications:true,reminderDays:[7,1,0],captionLanguage:'en',defaultTargets:['ig_feed'],mediaLimitMB:100}};
let state=load(),page='home',calMonth=new Date(),selectedDay='',editing=null,importMode='auto',bulkMode=false,bulkSelected=new Set();
function load(){let base=JSON.parse(JSON.stringify(defaultStore));try{let raw=window.PostFlowNative?.getState?.()||'{}';if(raw==='{}')raw=localStorage.getItem(K)||'{}';let found=JSON.parse(raw);return {...base,...found,trash:found.trash||[],apiConfig:found.apiConfig||{},brands:found.brands||[],captionTemplates:found.captionTemplates||[],settings:{...base.settings,...(found.settings||{})}}}catch(e){return base}}
function save(){const json=JSON.stringify(state);let stored=false;try{localStorage.setItem(K,json);stored=true}catch(e){console.warn('Browser local storage unavailable',e)}try{if(window.PostFlowNative?.syncState){PostFlowNative.syncState(json);stored=true}}catch(e){console.error('Android storage unavailable',e)}if(!stored)toast('Unable to save. Export backup and free storage.');return stored}
function setTheme(choice,persist=true){
 if(!['system','dark','light'].includes(choice))choice='system';
 if(persist){state.settings.theme=choice;save();}
 const mode=choice==='system'?(window.matchMedia?.('(prefers-color-scheme: light)').matches?'light':'dark'):choice;

 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',mode==='light'?'#f5f6fa':'#0b1020');
}
setTheme(state.settings.theme||'system',false);
window.matchMedia?.('(prefers-color-scheme: light)')?.addEventListener?.('change',()=>{if((state.settings.theme||'system')==='system')setTheme('system',false)});
function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function dateLocal(d=new Date()){let a=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);let g=t=>a.find(p=>p.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`}
function addDays(s,n){let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

function render(){navRender();const el=document.getElementById('page');let c=counts();if(page==='home'){
 const upcoming=[...state.posts].filter(p=>p.status==='scheduled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);

 let year=dateLocal().slice(0,4),count=0;
 list.forEach(([title,monthDay])=>{if(!state.events.some(e=>e.title===title&&e.date.endsWith(monthDay))){state.events.push({id:uid(),title,date:year+'-'+monthDay,type:'festival',repeat:true,private:false});count++}});

function setComposerStage(n){

 const names=['Media','Caption','Schedule','Accounts','Review'];
 document.querySelectorAll('.composer-stage').forEach(x=>{x.hidden=Number(x.dataset.stage)!==composerStage});
 for(let i=1;i<=5;i++)document.getElementById('composerPip_'+i)?.classList.toggle('active',i<=composerStage);
 const progress=document.getElementById('wizardProgress');if(progress)progress.textContent='Step '+composerStage+' of 5 · '+names[composerStage-1];
 const back=document.getElementById('wizBack'),next=document.getElementById('wizNext');
 if(back)back.disabled=composerStage===1;
 if(next)next.style.display=composerStage===5?'none':'block';
 document.querySelector('#overlay .sheet')?.scrollTo({top:0,behavior:'smooth'});
}

async function storePost(scheduleNow=false){
  const selectedWP=scheduleNow?Array.from(document.querySelectorAll('.direct-destination')).filter(x=>x.value).map(x=>({a:(state.wpAccounts||[]).filter(a=>a.platform==='facebook'||a.platform==='instagram')[Number(x.dataset.index)],placement:x.value})).filter(x=>x.a):[];
  if(scheduleNow){
    if(!hasWordPressPair())return toast('WordPress not connected. Save as Draft first, then connect through Accounts.');
    if(!selectedWP.length)return toast('Choose a WordPress publishing account before scheduling.');
    const d=document.getElementById('pDate')?.value,t=document.getElementById('pTime')?.value;
    const at=Date.parse(d+'T'+t+':00+05:30')/1000;
    if(!Number.isFinite(at)||at<Math.floor(Date.now()/1000)+120)return toast('Choose a future schedule at least 2 minutes ahead (IST).');
    if(!window.PostFlowNative?.queueWordPressPost)return toast('Android publishing support unavailable.');
    const chosenCarousel=pendingCarouselFiles.length>1||document.getElementById('pKind')?.value==='carousel';
    if(selectedWP.some(x=>x.placement==='carousel')&&!chosenCarousel&&!((editing&&state.posts.find(x=>x.id===editing)?.mediaIds?.length>1)))return toast('Choose 2–10 carousel photos before selecting Carousel Feed.');
    if(chosenCarousel&&selectedWP.some(x=>x.placement!=='carousel'))return toast('Multiple photos require Carousel Feed. Select Carousel for each chosen publishing account.');
  }

  const title=document.getElementById('pTitle').value.trim(),date=document.getElementById('pDate').value,time=document.getElementById('pTime').value,status=document.getElementById('pStatus').value;
  const targets=DEST.map(x=>x[0]).filter(k=>document.getElementById('tar_'+k).checked);
  if(!title||!date||!time){toast('Title, date and time required');return}
  if(editing&&hasActiveServerJobs(editing)){toast('Server job already submitted. Editing here will not update WordPress, so edit is blocked.');return}
  if(!scheduleNow&&status==='scheduled'&&!targets.length){toast('Select destinations or save as Draft');return}
  let old=state.posts.find(x=>x.id===editing)||{},id=editing||uid();
  let accountTargets={};state.accounts.forEach(a=>{let destinations=placementsForAccount(a).map(x=>x[0]).filter(k=>document.getElementById('account_'+a.id+'_'+k)?.checked);if(destinations.length)accountTargets[a.id]=destinations});
  let post={...old,id,title,date,time,status:scheduleNow?'uploading': 'draft',targets,accountTargets,ratio:document.getElementById('pRatio')?.value||'original',fitMode:document.getElementById('pFit')?.value||'contain',caption:document.getElementById('pCaption').value,kind:document.getElementById('pKind').value};if(editedPosterFile&&posterPendingLayers){post.posterLayers=posterPendingLayers;post.sourceMediaId=old.sourceMediaId||old.mediaId||null;}
  const carouselFiles=[...pendingCarouselFiles];
  if(carouselFiles.length){
    if(carouselFiles.length<2||carouselFiles.length>10||carouselFiles.some(f=>!['image/jpeg','image/png'].includes(f.type))){toast('Select 2–10 JPG/PNG images');return}
    let ids=[],firstBytes=null;
    const selectedRatio=document.getElementById('pRatio')?.value||'original';
    const targetRatio=(selectedRatio==='1:1'||selectedRatio==='4:5')?selectedRatio:'4:5';
    const fitMode=document.getElementById('pFit')?.value||'contain';
    try{
      for(let n=0;n<carouselFiles.length;n++){
        const converted=await normalizeCarouselImage(carouselFiles[n],targetRatio,fitMode);
        const id=uid().replace(/[^a-zA-Z0-9_-]/g,'');
        const bytes=new Uint8Array(await converted.arrayBuffer());
        if(!await persistMedia(id,'carousel_'+(n+1)+'.jpg',bytes))throw Error('Cannot save carousel image '+(n+1));
        if(!firstBytes)firstBytes=bytes;
        ids.push(id);
      }
    }catch(e){ids.forEach(cleanupMedia);toast('Carousel preparation failed: '+(e.message||'Invalid image'));return}
    post.mediaIds=ids;post.mediaId=ids[0];post.mediaName=ids.length+' prepared JPEG images';

  }
  let file=carouselFiles.length?null:(editedPosterFile||document.getElementById('pMedia').files[0]);
  if(post.kind==='carousel'&&(!post.mediaIds||post.mediaIds.length<2)){toast('Attach 2–10 carousel images');return}
  if(post.kind!=='carousel'&&!carouselFiles.length)post.mediaIds=[];
  if(file){
    if(file.size>100*1024*1024){toast('Single file limit: 100 MB');return}
    const bytes=new Uint8Array(await file.arrayBuffer());
    const mediaId=uid().replace(/[^a-zA-Z0-9_-]/g,'');
    if(!await persistMedia(mediaId,file.name,bytes)){toast('Media could not be saved; post not updated');return}
    post.mediaId=mediaId;post.mediaName=file.name;
    post.thumb=file.type.startsWith('image/')?await thumbnail(bytes,file.type):'';
    post.kind=file.type.startsWith('video/')?'reel':'image';
  }
  if(editing)state.posts=state.posts.map(x=>x.id===editing?post:x);else state.posts.push(post);
  if(!save()){if(!editing)state.posts.pop();return}
  (old.mediaIds?.length?old.mediaIds:[old.mediaId]).filter(Boolean).forEach(id=>{if(!(post.mediaIds||[]).includes(id)&&post.mediaId!==id&&post.sourceMediaId!==id&&!state.posts.some(x=>x.id!==post.id&&(x.mediaId===id||(x.mediaIds||[]).includes(id)||x.sourceMediaId===id)))cleanupMedia(id)});
  editedPosterFile=null;posterPendingLayers=null;pendingCarouselFiles=[];carouselPreviewUrls.forEach(URL.revokeObjectURL);carouselPreviewUrls=[];closeModal();route('queue');

}

async function whatsApp(id){
  let p=state.posts.find(x=>x.id===id);if(!p)return;
  let message=p.caption||p.title;
  if(p.mediaId&&window.PostFlowNative?.hasMedia(p.mediaId)){PostFlowNative.shareMedia(p.mediaId,message);return}
  if(p.mediaId && !window.PostFlowNative){
     let data=await retrieveWebMedia(p.mediaId);
     if(data&&navigator.canShare&&navigator.canShare({files:[new File([data],p.mediaName||'poster.jpg',{type:data.type||'image/jpeg'})]})){
       try{await navigator.share({files:[new File([data],p.mediaName||'poster.jpg',{type:data.type||'image/jpeg'})],text:message});return}catch(e){}
     }
  }
  if(window.PostFlowNative?.shareText)PostFlowNative.shareText(message);
  else window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank');
}

function guessDate(path){let hit=path.match(/(?:20\d\d)[-_./](?:0?[1-9]|1[0-2])[-_./](?:[0-2]?\d|3[01])/)||path.match(/(?:[0-2]?\d|3[01])[-_.](?:0?[1-9]|1[0-2])[-_.]20\d\d/);if(!hit)return '';let a=hit[0].split(/[-_./]/);let s=a[0].length===4?`${a[0]}-${a[1].padStart(2,'0')}-${a[2].padStart(2,'0')}`:`${a[2]}-${a[1].padStart(2,'0')}-${a[0].padStart(2,'0')}`;return !isNaN(Date.parse(s))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s?s:''}
function titleFromName(path){let pieces=path.split('/').filter(Boolean),folder=pieces.length>1?pieces[pieces.length-2]:pieces[0],out=folder.replace(/\.(jpg|jpeg|png|webp|mp4|mov)$/i,'').replace(/20\d\d[-_.]\d{1,2}[-_.]\d{1,2}|\d{1,2}[-_.]\d{1,2}[-_.]20\d\d/g,'').replace(/[_-]/g,' ').trim();return out||'Scheduled Content'}

async function thumbnail(bytes,mime){return new Promise(resolve=>{if(!mime.startsWith('image/'))return resolve('');let blob=new Blob([bytes],{type:mime}),u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,160/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);let ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.58))};im.onerror=()=>{URL.revokeObjectURL(u);resolve('')};im.src=u})}
function safeFileName(name){return String(name||'media').split('/').pop().slice(0,160)}
function base64Chunk(bytes){let result='';for(let i=0;i<bytes.length;i++)result+=String.fromCharCode(bytes[i]);return btoa(result)}
async function normalizeCarouselImage(file,ratio,fitMode){
 // Render to a common Instagram-supported canvas dimension before persisting/uploading.
 // The user's original File remains untouched.
 const dimensions=ratio==='1:1'?[1080,1080]:[1080,1350];
 // Android WebView loads this UI from file://. Blob URLs may fail in that origin.
 // Read the chosen content URI as bytes and decode through a data URL first.
 // Blob URL is retained only as a fallback for compatible environments.
 const blobURL=URL.createObjectURL(file);
 try{
   const loadImage=(src)=>new Promise((resolve,reject)=>{
     const img=new Image();
     img.onload=()=>resolve(img);
     img.onerror=()=>reject(Error('Image decode failed'));
     img.src=src;
   });
   let image;
   try{
     const dataURL=await new Promise((resolve,reject)=>{
       const reader=new FileReader();
       reader.onload=()=>resolve(reader.result);
       reader.onerror=()=>reject(Error('Could not read photo from device'));
       reader.readAsDataURL(file);
     });
     image=await loadImage(dataURL);
   }catch(primaryError){
     try{image=await loadImage(blobURL)}
     catch(fallbackError){throw Error('Cannot open '+file.name+'. Try reselecting it from Gallery or exporting it as a normal JPEG. '+primaryError.message)}
   }
   const iw=image.naturalWidth,ih=image.naturalHeight;
   if(!iw||!ih)throw Error('Invalid image dimensions');
   const canvas=document.createElement('canvas');
   canvas.width=dimensions[0];canvas.height=dimensions[1];
   const ctx=canvas.getContext('2d');
   if(!ctx)throw Error('Image converter unavailable');
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
   ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
   const scale=(fitMode==='cover'?Math.max:Math.min)(canvas.width/iw,canvas.height/ih);
   const w=iw*scale,h=ih*scale;
   ctx.drawImage(image,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
   const output=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('JPEG export failed')),'image/jpeg',0.92));
   if(output.size>8*1024*1024)throw Error('Prepared image exceeds 8 MB');
   return output;
 }finally{URL.revokeObjectURL(blobURL)}
}
async function persistMedia(id,name,bytes){
 try{
   if(window.PostFlowNative?.beginMedia){
     if(!PostFlowNative.beginMedia(id,safeFileName(name)))return false;
     let success=false;
     try{
       for(let i=0;i<bytes.length;i+=192*1024){
         let encoded=base64Chunk(bytes.subarray(i,i+192*1024));
         if(!PostFlowNative.appendMedia(id,encoded))throw Error('Storage write failed');
         if(i%(192*1024*12)===0)await new Promise(ok=>setTimeout(ok,0));
       }
       success=true;
       return true;
     }finally{PostFlowNative.finishMedia(id,success)}
   }
   // Web-browser preview/testing: persist a Blob in IndexedDB rather than localStorage.
   return await storeWebMedia(id,new Blob([bytes],{type:/\.mp4$/i.test(name)?'video/mp4':/\.png$/i.test(name)?'image/png':'image/jpeg'}));
 }catch(e){console.error('Media persistence error',e);return false}
}
function cleanupMedia(id){if(window.PostFlowNative?.deleteMedia)PostFlowNative.deleteMedia(id);else mediaDB().then(db=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=()=>db.close()}).catch(()=>{})}
function mediaDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('postflow-local-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeWebMedia(id,blob){try{let db=await mediaDB();return await new Promise(ok=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').put(blob,id);tx.oncomplete=()=>{db.close();ok(true)};tx.onerror=()=>{db.close();ok(false)}})}catch(e){return false}}
async function retrieveWebMedia(id){try{let db=await mediaDB();return await new Promise(resolve=>{let r=db.transaction('media').objectStore('media').get(id);r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();resolve(null)}})}catch(e){return null}}
function csvRows(text){
 let rows=[],row=[],col='',quoted=false;
 for(let i=0;i<text.length;i++){
   let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){col+='"';i++}else quoted=!quoted}
   else if(c===','&&!quoted){row.push(col);col=''}
   else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(col);if(row.some(Boolean))rows.push(row);row=[];col=''}
   else col+=c;
 }
 row.push(col);if(row.some(Boolean))rows.push(row);
 if(rows.length<2)return {};
 let headers=rows.shift().map(x=>x.trim().toLowerCase()),out={};
 for(let parts of rows){let r={};headers.forEach((h,i)=>r[h]=parts[i]?.trim()||'');let name=r.file||r.filename||r.path;if(name)out[name.replaceAll('\\','/')]=r;}
 return out;
}
function parseManifestDate(value){if(!value)return '';let d=guessDate(value);return d||(/^\d{4}-\d{2}-\d{2}$/.test(value)?value:'')}
async function processZip(){
 const file=document.getElementById('zipInput').files[0],mode=document.getElementById('zipMode').value,targets=DEST.map(x=>x[0]).filter(k=>document.getElementById('zip_'+k).checked);
 if(!file){toast('Choose ZIP file');return}
 if(file.size>200*1024*1024){toast('ZIP limit 200 MB');return}
 if(!window.JSZip){toast('ZIP library missing');return}
 const control=document.querySelector('#overlay .btn.full');if(control){control.disabled=true;control.textContent='Importing…'}
 let added=0,duplicates=0,review=0,skipped=0;
 try{
   let zip=await JSZip.loadAsync(file,{checkCRC32:true});
   let entries=Object.values(zip.files).filter(e=>!e.dir && /\.(png|jpe?g|webp|mp4|mov)$/i.test(e.name) && !e.name.startsWith('__MACOSX/'));
   if(entries.length>250)throw Error('ZIP maximum 250 media files');
   let compressedSize=entries.reduce((s,e)=>s+(e._data?.uncompressedSize||0),0);
   if(compressedSize>500*1024*1024)throw Error('Extracted media exceeds 500 MB');
   let csv=Object.values(zip.files).find(e=>!e.dir && /(^|\/)manifest\.csv$/i.test(e.name));
   let manifest=csv?csvRows(await csv.async('text')):{};
   let seen=new Set(state.posts.map(p=>p.fingerprint).filter(Boolean));
   let times=new Set(state.posts.filter(p=>p.status==='scheduled').map(p=>p.date+'|'+p.time));
   for(let f of entries){
     if((f._data?.uncompressedSize||0)>100*1024*1024){skipped++;continue}
     let bytes=await f.async('uint8array');if(bytes.length>100*1024*1024){skipped++;continue}
     let crc=f._data?.crc32??bytes.reduce((h,b)=>((h*33)^b)>>>0,5381),fingerprint=bytes.length+':'+crc;
     if(seen.has(fingerprint)){duplicates++;continue}seen.add(fingerprint);
     let meta=manifest[f.name]||manifest[safeFileName(f.name)]||{};
     let date=guessDate(safeFileName(f.name))||parseManifestDate(meta.date)||guessDate(f.name),category=meta.category||pickCategory(f.name);
     let title=meta.title||titleFromName(f.name),video=/\.(mp4|mov)$/i.test(f.name);
     let mime=video?'video/mp4':/\.png$/i.test(f.name)?'image/png':/\.webp$/i.test(f.name)?'image/webp':'image/jpeg';
     let mediaId=uid(),written=await persistMedia(mediaId,safeFileName(f.name),bytes);
     if(!written){skipped++;continue}
     let thumb=video?'':await thumbnail(bytes,mime);
     let time=/^([01]\d|2[0-3]):[0-5]\d$/.test(meta.time||'')?meta.time:state.settings.time;
     let selected=(meta.destinations||meta.targets)?String(meta.destinations||meta.targets).split(/[|;]/).map(t=>t.trim()).filter(t=>DEST.some(d=>d[0]===t)):targets;
     let shouldSchedule=mode==='auto'&&date&&date>=dateLocal()&&category!=='birthday'&&selected.length>0;
     if(shouldSchedule){while(times.has(date+'|'+time)){
       let [h,m]=time.split(':').map(Number),newMin=h*60+m+15;
       if(newMin>=1440){shouldSchedule=false;break}
       time=String(Math.floor(newMin/60)).padStart(2,'0')+':'+String(newMin%60).padStart(2,'0');
     }if(shouldSchedule)times.add(date+'|'+time)}
     if(!shouldSchedule)review++;
     state.posts.push({id:uid(),title,caption:meta.caption||makeCaption(title,category),kind:video?'reel':'image',date:date||dateLocal(),time,targets:[...selected],accountTargets:{},status:shouldSchedule?'scheduled':'draft',thumb,fingerprint,origin:file.name,category,mediaId,mediaName:safeFileName(f.name)});
     added++;
     if(category==='festival'&&date&&!state.events.some(e=>e.title.toLowerCase()===title.toLowerCase()&&e.date===date))
       state.events.push({id:uid(),title,date,type:'festival',repeat:false,private:false});
   }
   state.imports.unshift({id:uid(),name:file.name,imported:new Date().toLocaleDateString('en-IN'),added,duplicates,skipped,review});

function submitDirectWordPress(p,selected){
 const at=Math.floor(Date.parse(p.date+'T'+p.time+':00+05:30')/1000);
 if(!Number.isFinite(at)||at<Math.floor(Date.now()/1000)+120)return toast('Schedule expired. Edit date/time and try again.');
 if(Object.values(state.wpPendingJobs||{}).some(j=>j.postId===p.id&&['uploading','scheduled','processing','published'].includes(j.status)))return toast('Publishing job already exists. Check status first.');
 state.wpPendingJobs=state.wpPendingJobs||{};
 for(const {a,placement} of selected){
  const key='pf_'+uid().replace(/[^a-zA-Z0-9_-]/g,'');
  state.wpPendingJobs[key]={title:p.title,postId:p.id,account:a.name,placement,status:'uploading',scheduled_at:at};
  try{
   if(placement==='carousel'){
    if(!p.mediaIds||p.mediaIds.length<2)throw Error('Carousel needs 2 or more images.');
    if(!window.PostFlowNative?.queueWordPressCarousel)throw Error('Carousel upload not supported in this APK.');
    PostFlowNative.queueWordPressCarousel(JSON.stringify(p.mediaIds),key,a.platform,a.external_id,p.caption||'',at);
   }else{
    if(!p.mediaId)throw Error('Image or video is missing.');
    PostFlowNative.queueWordPressPost(p.mediaId,key,a.platform,a.external_id,placement,p.caption||'',at);
   }
  }catch(e){state.wpPendingJobs[key].status='upload_failed';state.wpPendingJobs[key].error=e.message||'Upload could not start';}
 }
 save();
}
function submitPublishPost(id){
 const p=state.posts.find(x=>x.id===id);if(!p)return;
 const date=document.getElementById('publishDate')?.value||p.date;
 const time=document.getElementById('publishTime')?.value||p.time;
 const timestamp=Date.parse(date+'T'+time+':00+05:30');
 const at=Math.floor(timestamp/1000);
 const now=Math.floor(Date.now()/1000);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time)||!Number.isFinite(at)||at<now+120){
   const error=document.getElementById('publishTimeError');
   const nowIST=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'});
   if(error){error.style.display='block';error.textContent='Invalid publishing time. Current IST: '+nowIST+'. Select at least 2 minutes ahead, or use the +10 minutes button.';}
   return;
 }
 const err=document.getElementById('publishTimeError');if(err)err.style.display='none';
 const accounts=(state.wpAccounts||[]).filter(x=>x.platform==='facebook'||x.platform==='instagram');
 const selected=accounts.flatMap((a,i)=>{const placement=document.getElementById('pub_'+i)?.value;return placement?[{a,placement}]:[]});
 if(!selected.length)return toast('Select at least one destination');
 if(Object.values(state.wpPendingJobs||{}).some(j=>j.postId===id&&j.serverId&&['scheduled','processing','published','attention'].includes(j.status)))return toast('A server job already exists. Check its status before uploading again.');
 if(!confirm('Schedule '+selected.length+' publishing job(s) on WordPress for '+date+' '+time+' IST?'))return;
 state.wpPendingJobs=state.wpPendingJobs||{};
 selected.forEach(({a,placement})=>{
  const key='pf_'+uid().replace(/[^a-zA-Z0-9_-]/g,'');
  state.wpPendingJobs[key]={title:p.title,postId:p.id,account:a.name,placement,status:'uploading',scheduled_at:at};
  if(placement==='carousel')PostFlowNative.queueWordPressCarousel(JSON.stringify(p.mediaIds),key,a.platform,a.external_id,p.caption||'',at);else PostFlowNative.queueWordPressPost(p.mediaId,key,a.platform,a.external_id,placement,p.caption||'',at);
 });
 p.date=date;p.time=time;save();closeModal();route('accounts');toast('Uploading jobs; check Publishing Jobs for results');

window.onPostFlowPublish=function(raw){
 try{
  const r=JSON.parse(raw);
  if(r.mutation){if(r.ok&&r.job){state.wpServerJobs=(state.wpServerJobs||[]).map(j=>Number(j.id)===Number(r.job_id)?r.job:j);for(const local of Object.values(state.wpPendingJobs||{})){if(Number(local.serverId)===Number(r.job_id)){local.status=r.job.status;local.scheduled_at=r.job.scheduled_at;local.error=r.job.error||'';}}save();toast(r.mutation==='DELETE'?'Scheduled job cancelled on WordPress':'WordPress job updated');showJobDetail(Number(r.job_id));}else{toast(r.error||'Update was rejected');showJobDetail(Number(r.job_id));}return;}
  if(r.client_id){const j=(state.wpPendingJobs||{})[r.client_id];if(j){j.status=r.ok?(r.job?.status||'scheduled'):'upload_failed';j.serverId=r.job?.id||null;j.error=r.error||'';if(j.postId){const p=state.posts.find(x=>x.id===j.postId);if(p){const others=Object.values(state.wpPendingJobs||{}).filter(x=>x.postId===j.postId);p.status=others.every(x=>x.status==='upload_failed')?'draft':others.some(x=>x.status==='uploading')?'uploading':'scheduled';}}}save();toast(r.ok?'WordPress accepted the publishing job':r.error||'Upload failed');if(page==='accounts')render();}
  else if(Array.isArray(r.jobs)){state.wpServerJobs=r.jobs;for(const j of r.jobs){const local=(state.wpPendingJobs||{})[j.client_job_id];if(local){local.status=j.status;local.published_at=j.published_at||0;local.scheduled_at=j.scheduled_at||local.scheduled_at;local.serverId=j.id;local.error=j.error||'';}}save();showPublishJobs();}
  else if(r.error)toast(r.error);
 }catch(e){toast('Unexpected publishing response');}
};
function publishTime(v,status){return v?new Date(v*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'})+' IST':(status==='published'?'Not recorded (older post)':'Not published yet')}
function publishingHistory(id){const items=Object.values(state.wpPendingJobs||{}).filter(x=>x.postId===id);return items.length?'<div class="card"><h3>Publishing History</h3>'+items.map(j=>'<div class="item"><div class="body"><b>'+esc(j.account)+' · '+esc(j.placement)+'</b><small>Status: '+esc(j.status)+'</small><small>Scheduled: '+publishTime(j.scheduled_at)+'</small><small>Published: '+publishTime(j.published_at,j.status)+'</small>'+(j.error?'<small>Error: '+esc(j.error)+'</small>':'')+'</div></div>').join('')+'</div>':''}

function issueHelp(j){
 const raw=String(j.error||j.last_error||'');
 const lower=raw.toLowerCase(),code=String(j.error_code||'');
 if(!raw&&j.status!=='published'&&j.status!=='scheduled')return {cause:'Server has not supplied an error detail yet.',fix:'Refresh the job and check WordPress server logs if the status remains unchanged.'};
 if(/token|oauth|expired|190|access.*invalid/.test(lower))return {cause:'Account authorization may have expired or been revoked.',fix:'Reconnect this account through WordPress PostFlow Connect, then verify the current server job before retrying.'};
 if(/permission|scope|(#200)|(#10)|not authorized/.test(lower))return {cause:'The account does not appear to have the required publishing permission.',fix:'Check Meta App permissions and the connected Page/Instagram role; reconnect the account afterward.'};
 if(/format|aspect|resolution|image|media|video|codec|unsupported|400/.test(lower))return {cause:'The selected media may not meet the platform publishing requirements.',fix:'Review image/video format, size and aspect ratio; create a corrected job only after checking whether the original was published.'};
 if(/rate limit|429|quota|too many/.test(lower))return {cause:'The platform is limiting publishing requests.',fix:'Wait and retry only after the server confirms the previous attempt failed.'};
 if(/cron|schedule|timeout|network|connection|500|502|503/.test(lower))return {cause:'The server scheduler or API connection may be unavailable.',fix:'Check WordPress scheduled tasks and hosting logs. Do not resubmit until you confirm this job did not publish.'};
 return {cause:raw?'The server or platform rejected this publishing attempt.':'The publishing status is pending confirmation.',fix:'Review the technical error below and check the account on the platform before retrying.'};
}
function jobStatusClass(j){return ['failed','attention','error','upload_failed'].includes(j.status)?'red':j.status==='published'?'green':''}
function jobErrorPanel(j){

 if(!['failed','attention','error','upload_failed'].includes(j.status)&&!e)return '';
 const guide=issueHelp(j);
 return '<div class="detail-error"><strong>Why was this post not published?</strong><p>'+esc(guide.cause)+'</p><p><b>What to do:</b> '+esc(guide.fix)+'</p><div class="line"></div><small>Platform / server error: '+esc(e||'No detailed error was provided by the server.')+'</small><small> · Code: '+esc(j.error_code||'Not provided')+'</small></div>';
}
